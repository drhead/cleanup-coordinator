<div x-show="currentScreen === 'projects'" class="space-y-6">
    <h2 class="text-xl font-bold text-gray-200">Select a Project</h2>
    
    <!-- Projects Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <template x-for="project in projects" :key="project.project_id">
            <!-- Project Card -->
            <div class="bg-gray-900 border border-gray-800 hover:border-blue-500/50 rounded-lg p-5 cursor-pointer transition group"
                @click="selectProject(project.project_id)">
                
                <!-- Project Header -->
                <div class="flex items-start justify-between mb-2">
                    <h3 class="font-bold text-lg text-blue-400 group-hover:text-blue-300" x-text="project.title"></h3>
                    <span class="text-xs font-mono text-gray-500" x-text="project.project_id"></span>
                </div>
                
                <!-- Project Description -->
                <p class="text-sm text-gray-300 mb-4" x-text="project.description"></p>
                
                <!-- Project Overall Progress Bar -->
                <div class="space-y-1.5 mb-4">
                    <div class="flex items-center justify-between text-xs font-mono">
                        <span class="text-gray-400">Overall Progress</span>
                        <span class="text-gray-200 font-bold" 
                            x-text="`${getProjectResolvedCount(project)}/${getProjectTotalCount(project)} (${getProgressPercent(getProjectResolvedCount(project), getProjectTotalCount(project))}%)`"></span>
                    </div>
                    <div class="w-full bg-gray-950 rounded-full h-2 overflow-hidden border border-gray-800">
                        <div class="bg-blue-500 h-full transition-all duration-300 rounded-full"
                            :style="`width: ${getProgressPercent(getProjectResolvedCount(project), getProjectTotalCount(project))}%`"
                            :class="getProgressPercent(getProjectResolvedCount(project), getProjectTotalCount(project)) === 100 ? 'bg-green-500' : 'bg-blue-500'"></div>
                    </div>
                </div>
                
                <!-- Project Card Footer Link -->
                <div class="flex items-center justify-between text-xs text-gray-500 pt-2 border-t border-gray-800/60">
                    <span>Click to view batches</span>
                    <span class="text-blue-400 font-semibold group-hover:translate-x-1 transition-transform">Explore &rarr;</span>
                </div>
            </div>
        </template>
    </div>
</div>
