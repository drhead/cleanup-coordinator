<!-- Main Application Loading Screen -->
<div 
    x-show="isLoading" 
    x-transition:leave="transition ease-out duration-300"
    x-transition:leave-start="opacity-100"
    x-transition:leave-end="opacity-0"
    class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-slate-900/95 backdrop-blur-sm text-slate-100 select-none"
    style="display: none;"
>
    <div class="flex flex-col items-center w-80 text-center space-y-4 p-6 rounded-xl bg-slate-800/80 border border-slate-700/50 shadow-2xl">
        
        <!-- Spinner & Center Percentage / Pulse -->
        <div class="relative flex items-center justify-center">
            <div class="w-14 h-14 border-4 border-indigo-500/20 border-t-indigo-500 rounded-full animate-spin"></div>
            
            <!-- Shows percentage inside spinner if provided, otherwise shows pulsing core -->
            <template x-if="loadingPercent !== null">
                <span class="absolute text-xs font-bold text-indigo-300" x-text="`${Math.round(loadingPercent)}%`"></span>
            </template>
            <template x-if="loadingPercent === null">
                <div class="absolute w-2 h-2 bg-indigo-400 rounded-full animate-ping"></div>
            </template>
        </div>

        <!-- Text Indicator -->
        <div class="space-y-1 w-full">
            <h3 class="text-xs font-semibold tracking-wider uppercase text-slate-400">Loading...</h3>
            <p class="text-sm font-medium text-slate-200 truncate px-2" x-text="loadingText"></p>
        </div>

        <!-- Progress Bar Container -->
        <div class="w-full bg-slate-700/50 h-2 rounded-full overflow-hidden relative">
            
            <!-- Deterministic Progress Bar (When loadingPercent is a number 0-100) -->
            <div 
                x-show="loadingPercent !== null"
                class="bg-gradient-to-r from-indigo-500 to-sky-400 h-full rounded-full transition-all duration-300 ease-out"
                :style="`width: ${Math.max(0, Math.min(100, loadingPercent || 0))}%`"
            ></div>

            <!-- Indeterminate Animated Bar (When loadingPercent is null) -->
            <div 
                x-show="loadingPercent === null"
                class="bg-gradient-to-r from-indigo-500 to-sky-400 h-full w-1/3 rounded-full animate-[shimmer_1.5s_infinite_linear]"
            ></div>

        </div>
    </div>
</div>
