<div x-data="ComparisonManager(cluster)" class="my-3">
    <!-- Centered Trigger Button (Logged In Only) -->
    <template x-if="e621User && !isActive">
        <div class="flex justify-center py-2">
            <button @click="startComparison()"
                    :disabled="isLoading"
                    class="bg-blue-600 hover:bg-blue-500 disabled:opacity-50 disabled:cursor-not-allowed text-white text-xs px-4 py-2 rounded font-semibold transition flex items-center gap-2 shadow-md">
                <span x-show="!isLoading">🔍</span>
                <span x-show="isLoading" class="animate-spin">⏳</span>
                <span x-text="isLoading ? 'Fetching post metadata...' : 'Start Comparison'"></span>
            </button>
        </div>
    </template>

    <!-- Step 1: Comparison Interface -->
    <template x-if="isActive">
        <div class="bg-gray-950 border border-gray-800 rounded-lg p-4 space-y-4">
            
            <!-- Comparison Header Controls -->
            <div class="flex flex-wrap items-center justify-between gap-3 border-b border-gray-800 pb-3">
                
                <!-- Pair Switcher Tabs -->
                <div class="flex items-center gap-1.5 overflow-x-auto">
                    <span class="text-xs font-semibold text-gray-400 mr-1">Pairs:</span>
                    <template x-for="(pair, idx) in pairs" :key="idx">
                        <button @click="activePairIndex = idx"
                                class="text-xs px-2.5 py-1 rounded font-mono transition"
                                :class="activePairIndex === idx 
                                    ? 'bg-blue-600 text-white font-bold' 
                                    : (pair.relationship ? 'bg-gray-800 text-green-400 border border-green-800/60' : 'bg-gray-900 text-gray-400 hover:text-white border border-gray-800')">
                            <span x-text="`#${pair.a.id} × #${pair.b.id}`"></span>
                            <template x-if="pair.relationship">
                                <span class="ml-1 text-[10px]">✓</span>
                            </template>
                        </button>
                    </template>
                </div>

                <!-- Zoom Control (Side-by-Side Mode) -->
                <div x-show="mode === 'side-by-side'" class="flex items-center gap-2 text-xs text-gray-400">
                    <span>Zoom:</span>
                    <input type="range" min="1" max="4" step="0.5" 
                        x-model.number="zoomLevel" 
                        class="w-20 accent-blue-500 cursor-pointer">
                    <span class="font-mono w-6" x-text="`${zoomLevel}x`"></span>
                </div>

                <!-- Mode Selector & Exit -->
                <div class="flex items-center gap-2">
                    <div class="flex bg-gray-900 border border-gray-800 rounded p-0.5">
                        <button @click="setMode('side-by-side')"
                                class="text-xs px-2.5 py-1 rounded font-medium transition"
                                :class="mode === 'side-by-side' ? 'bg-blue-600 text-white' : 'text-gray-400 hover:text-white'">
                            Side-by-Side
                        </button>
                        <button @click="setMode('swipe')"
                                class="text-xs px-2.5 py-1 rounded font-medium transition"
                                :class="mode === 'swipe' ? 'bg-blue-600 text-white' : 'text-gray-400 hover:text-white'">
                            Swipe
                        </button>
                        <button @click="setMode('diff')"
                                class="text-xs px-2.5 py-1 rounded font-medium transition"
                                :class="mode === 'diff' ? 'bg-blue-600 text-white' : 'text-gray-400 hover:text-white'">
                            Diff
                        </button>
                        <button @click="setMode('blink')"
                                class="text-xs px-2.5 py-1 rounded font-medium transition"
                                :class="mode === 'blink' ? 'bg-blue-600 text-white' : 'text-gray-400 hover:text-white'">
                            Blink
                        </button>
                    </div>

                    <button @click="closeComparison()" 
                            class="text-gray-400 hover:text-white text-xs px-2.5 py-1 rounded border border-gray-800 hover:bg-gray-800 font-semibold transition">
                        Exit
                    </button>
                </div>
            </div>

            <!-- View Area -->
            <template x-if="currentPair">
                <div class="space-y-4">
                    
                    <!-- 1. SIDE-BY-SIDE MODE -->
                    <div x-show="mode === 'side-by-side'" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- Image A Panel -->
                        <div class="flex flex-col items-center bg-gray-900 border border-gray-800 rounded-lg p-3">
                            <div class="w-full flex items-center justify-between mb-2">
                                <a :href="`https://e621.net/posts/${currentPair.a.id}`" target="_blank"
                                   class="text-xs font-mono font-bold text-blue-400 hover:underline"
                                   x-text="`Post #${currentPair.a.id}`"></a>
                                <span class="text-[11px] text-gray-500 font-mono"
                                      x-text="`${currentPair.a.file.width}×${currentPair.a.file.height}`"></span>
                            </div>
                            <div class="relative w-full h-[70vh] flex items-center justify-center bg-black/50 rounded overflow-hidden select-none">
                                <div class="relative max-h-full max-w-full flex items-center justify-center">
                                    <img :src="currentPair.a.file.url || currentPair.a.sample.url" 
                                         class="max-h-[70vh] max-w-full object-contain cursor-crosshair block"
                                         @mousemove="handleMouseMove($event, $el)"
                                         @mouseenter="isHovering = true"
                                         @mouseleave="handleMouseLeave()">

                                    <div x-show="isHovering" 
                                         class="absolute pointer-events-none border-2 border-blue-500 rounded shadow-2xl z-20 bg-no-repeat"
                                         :style="{
                                             ...getLoupeStyle(currentPair.a),
                                             left: `calc(${relX * 100}% - 90px)`,
                                             top: `calc(${relY * 100}% - 90px)`
                                         }">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Image B Panel -->
                        <div class="flex flex-col items-center bg-gray-900 border border-gray-800 rounded-lg p-3">
                            <div class="w-full flex items-center justify-between mb-2">
                                <a :href="`https://e621.net/posts/${currentPair.b.id}`" target="_blank"
                                   class="text-xs font-mono font-bold text-blue-400 hover:underline"
                                   x-text="`Post #${currentPair.b.id}`"></a>
                                <span class="text-[11px] text-gray-500 font-mono"
                                      x-text="`${currentPair.b.file.width}×${currentPair.b.file.height}`"></span>
                            </div>
                            <div class="relative w-full h-[70vh] flex items-center justify-center bg-black/50 rounded overflow-hidden select-none">
                                <div class="relative max-h-full max-w-full flex items-center justify-center">
                                    <img :src="currentPair.b.file.url || currentPair.b.sample.url" 
                                         class="max-h-[70vh] max-w-full object-contain cursor-crosshair block"
                                         @mousemove="handleMouseMove($event, $el)"
                                         @mouseenter="isHovering = true"
                                         @mouseleave="handleMouseLeave()">

                                    <div x-show="isHovering" 
                                         class="absolute pointer-events-none border-2 border-blue-500 rounded shadow-2xl z-20 bg-no-repeat"
                                         :style="{
                                             ...getLoupeStyle(currentPair.b),
                                             left: `calc(${relX * 100}% - 90px)`,
                                             top: `calc(${relY * 100}% - 90px)`
                                         }">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 2. SINGLE BOX MODES (SWIPE, DIFF, BLINK) -->
                    <div x-show="mode !== 'side-by-side'" class="flex flex-col items-center bg-gray-900 border border-gray-800 rounded-lg p-3">
                        <div class="w-full flex items-center justify-between mb-2">
                            <div class="flex items-center gap-3">
                                <span class="text-xs font-mono font-bold text-blue-400" x-text="`#${currentPair.a.id} (${currentPair.a.file.width}×${currentPair.a.file.height})`"></span>
                                <span class="text-xs text-gray-500 font-bold">vs</span>
                                <span class="text-xs font-mono font-bold text-blue-400" x-text="`#${currentPair.b.id} (${currentPair.b.file.width}×${currentPair.b.file.height})`"></span>
                            </div>
                            
                            <!-- Mode-specific status label -->
                            <div class="text-[11px] font-mono text-gray-400">
                                <span x-show="mode === 'swipe'">Move cursor across image to swipe</span>
                                <span x-show="mode === 'diff'">Difference overlay (matching pixels turn black)</span>
                                <span x-show="mode === 'blink'" x-text="`Showing: Post #${blinkShowB ? currentPair.b.id : currentPair.a.id}`" class="text-amber-400 font-bold"></span>
                            </div>
                        </div>

                        <div class="relative w-full h-[70vh] flex items-center justify-center bg-black/50 rounded overflow-hidden select-none">
                            
                            <!-- SWIPE MODE -->
                            <div x-show="mode === 'swipe'" 
                                 class="relative max-h-full max-w-full flex items-center justify-center cursor-ew-resize"
                                 @mousemove="handleSwipeMove($event, $el)">
                                <!-- Base Layer: Image A -->
                                <img :src="currentPair.a.file.url || currentPair.a.sample.url" 
                                     class="max-h-[70vh] max-w-full object-contain block pointer-events-none">

                                <!-- Top Layer: Image B (Clipped) -->
                                <img :src="currentPair.b.file.url || currentPair.b.sample.url" 
                                     class="absolute inset-0 w-full h-full object-contain block pointer-events-none"
                                     :style="`clip-path: inset(0 ${100 - swipePos}% 0 0);`">

                                <!-- Vertical Divider Line -->
                                <div class="absolute top-0 bottom-0 w-0.5 bg-blue-500 shadow-[0_0_10px_rgba(59,130,246,0.8)] pointer-events-none"
                                     :style="`left: ${swipePos}%;`">
                                </div>
                            </div>

                            <!-- DIFF MODE -->
                            <div x-show="mode === 'diff'" class="relative max-h-full max-w-full flex items-center justify-center bg-white">
                                <!-- Image A Base -->
                                <img :src="currentPair.a.file.url || currentPair.a.sample.url" 
                                     class="max-h-[70vh] max-w-full object-contain block">

                                <!-- Image B Difference Blend -->
                                <img :src="currentPair.b.file.url || currentPair.b.sample.url" 
                                     class="absolute inset-0 w-full h-full object-contain block"
                                     style="mix-blend-mode: difference;">
                            </div>

                            <!-- BLINK MODE -->
                            <div x-show="mode === 'blink'" class="relative max-h-full max-w-full flex items-center justify-center">
                                <img :src="(blinkShowB ? currentPair.b : currentPair.a).file.url || (blinkShowB ? currentPair.b : currentPair.a).sample.url" 
                                     class="max-h-[70vh] max-w-full object-contain block">
                            </div>

                        </div>
                    </div>

                    <!-- Relationship Actions for Current Pair -->
                    <div class="flex items-center justify-between pt-2 border-t border-gray-800">
                        <div class="text-xs text-gray-400">
                            Classify relation between <span class="font-mono text-gray-200" x-text="`#${currentPair.a.id}`"></span> and <span class="font-mono text-gray-200" x-text="`#${currentPair.b.id}`"></span>:
                        </div>
                        <div class="flex items-center gap-2">
                            <button @click="setRelationship('duplicate')"
                                    class="text-xs px-3 py-1.5 rounded font-semibold transition"
                                    :class="currentPair.relationship === 'duplicate' 
                                        ? 'bg-amber-600 text-white' 
                                        : 'bg-gray-800 hover:bg-amber-950/80 text-amber-300 border border-amber-800/60'">
                                Duplicate / Inferior
                            </button>

                            <button @click="setRelationship('variant')"
                                    class="text-xs px-3 py-1.5 rounded font-semibold transition"
                                    :class="currentPair.relationship === 'variant' 
                                        ? 'bg-purple-600 text-white' 
                                        : 'bg-gray-800 hover:bg-purple-950/80 text-purple-300 border border-purple-800/60'">
                                Variants
                            </button>

                            <button @click="setRelationship('unrelated')"
                                    class="text-xs px-3 py-1.5 rounded font-semibold transition"
                                    :class="currentPair.relationship === 'unrelated' 
                                        ? 'bg-gray-700 text-white' 
                                        : 'bg-gray-800 hover:bg-gray-700 text-gray-300 border border-gray-700'">
                                Unrelated
                            </button>
                        </div>
                    </div>

                </div>
            </template>
        </div>
    </template>
</div>
