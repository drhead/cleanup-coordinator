<div class="bg-gray-950/80 border border-gray-800/80 rounded-lg p-4 space-y-4 text-xs">

    <!-- Header Controls -->
    <div class="flex flex-wrap items-center justify-between gap-3 border-b border-gray-800/80 pb-3">

        <!-- Loupe / Magnifier Master Controls -->
        <div class="flex items-center gap-3 pr-3">
            <button @click="enableLoupe = !enableLoupe" title="Toggle Magnifier"
                class="w-7 h-7 rounded-md text-xs font-semibold flex items-center justify-center p-0 shrink-0 transition cursor-pointer border select-none"
                :class="enableLoupe 
                        ? 'bg-blue-600 hover:bg-blue-500 text-white border-blue-500 shadow-sm' 
                        : 'bg-gray-900 hover:bg-gray-800 text-gray-400 border-gray-800'">
                <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" stroke-width="2"
                    viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
                </svg>
            </button>

            <div x-show="enableLoupe"
                class="flex items-center gap-2 text-xs text-gray-400 border-l border-gray-800/80 pl-3">
                <span>Zoom:</span>
                <input type="range" min="1" max="4" step="0.5" x-model.number="zoomLevel"
                    class="w-16 accent-blue-500 cursor-pointer">
                <span class="font-mono w-5 text-right" x-text="`${zoomLevel}x`"></span>
            </div>
        </div>

        <!-- Mode Selector & Dynamic Controls -->
        <div class="flex items-center gap-3">
            <!-- Diff Multiply Slider -->
            <div x-show="mode === 'diff'"
                class="flex items-center gap-2 text-xs text-gray-400 pr-2 border-r border-gray-800/80">
                <span>Multiply:</span>
                <input type="range" min="1" max="5" step="0.25" x-model.number="diffMultiplier"
                    class="w-16 accent-blue-500 cursor-pointer">
                <span class="font-mono w-7 text-right" x-text="`${diffMultiplier.toFixed(1)}x`"></span>
            </div>

            <!-- Blink Rate Slider -->
            <div x-show="mode === 'blink'"
                class="flex items-center gap-2 text-xs text-gray-400 pr-2 border-r border-gray-800/80">
                <span>Rate:</span>
                <input type="range" min="1" max="6" step="0.5" x-model.number="blinkRate" @input="startBlink()"
                    class="w-16 accent-blue-500 cursor-pointer">
                <span class="font-mono w-8 text-right" x-text="`${blinkRate}Hz`"></span>
            </div>

            <div class="flex bg-gray-900 border border-gray-800 rounded-md p-0.5">
                <button @click="setMode('side-by-side')"
                    class="text-xs px-2.5 py-1 rounded font-medium transition cursor-pointer"
                    :class="mode === 'side-by-side' ? 'bg-blue-600 text-white' : 'text-gray-400 hover:text-white'">
                    Side-by-Side
                </button>
                <button @click="setMode('swipe')"
                    :disabled="hasMismatchedAspectRatio()"
                    :title="hasMismatchedAspectRatio() ? 'Disabled: Aspect ratio difference exceeds 5%' : ''"
                    class="text-xs px-2.5 py-1 rounded font-medium transition cursor-pointer"
                    :class="hasMismatchedAspectRatio() ? 'opacity-40 cursor-not-allowed text-gray-500' : (mode === 'swipe' ? 'bg-blue-600 text-white' : 'text-gray-400 hover:text-white')">
                    Swipe
                </button>
                <button @click="setMode('diff')"
                    :disabled="hasMismatchedAspectRatio()"
                    :title="hasMismatchedAspectRatio() ? 'Disabled: Aspect ratio difference exceeds 5%' : ''"
                    class="text-xs px-2.5 py-1 rounded font-medium transition cursor-pointer"
                    :class="hasMismatchedAspectRatio() ? 'opacity-40 cursor-not-allowed text-gray-500' : (mode === 'diff' ? 'bg-blue-600 text-white' : 'text-gray-400 hover:text-white')">
                    Diff
                </button>
                <button @click="setMode('blink')"
                    :disabled="hasMismatchedAspectRatio()"
                    :title="hasMismatchedAspectRatio() ? 'Disabled: Aspect ratio difference exceeds 5%' : ''"
                    class="text-xs px-2.5 py-1 rounded font-medium transition cursor-pointer"
                    :class="hasMismatchedAspectRatio() ? 'opacity-40 cursor-not-allowed text-gray-500' : (mode === 'blink' ? 'bg-blue-600 text-white' : 'text-gray-400 hover:text-white')">
                    Blink
                </button>
            </div>
        </div>
    </div>

    <!-- Main Image Display View Area -->
    <template x-if="currentPair">
        <div class="space-y-4">
            <!-- Warnings Stack Container (Positioned above image cards) -->
            <div x-data="{ scopeId: activePairIndex }" class="w-full">
                <load src="/templates/components/warning-banner.html" />
            </div>

            <div class="h-[60vh]">
                <!-- 1. SIDE-BY-SIDE MODE -->
                <div x-show="mode === 'side-by-side'"
                    class="h-full grid grid-cols-1 md:grid-cols-2 grid-rows-1 gap-4 items-start">
                    <template x-for="item in [currentPair.a, currentPair.b]" :key="item.postId">
                        <div class="border border-gray-800 rounded-lg bg-gray-950 flex flex-col relative max-h-full hover:z-20"
                            :style="{ height: getSbsCardHeight(item) }">
                            <!-- Header Bar -->
                            <div
                                class="bg-gray-900 px-2.5 py-1.5 flex items-center justify-between text-xs border-b border-gray-800 select-none shrink-0 rounded-t-[7px]">
                                <a :href="`https://e621.net/posts/${item.postId}`" target="_blank"
                                    class="font-mono font-bold text-blue-400 hover:text-blue-300 hover:underline shrink-0 flex items-center gap-1">
                                    <span x-text="`#${item.postId}`"></span>
                                    <template x-if="item.isEdited">
                                        <span class="text-emerald-400 font-bold text-xs" title="Post verified / edited in P.A.C.K." style="font-variant-emoji: text;">✓</span>
                                    </template>
                                </a>

                                <!-- Centered Artist Tags -->
                                <div class="flex-1 min-w-0 px-2 text-center truncate text-[11px]"
                                    :title="getArtistTags(item).length > 0 ? `by ${getArtistTags(item).join(', ')}` : ''">
                                    <template x-if="hasArtistMismatch()">
                                        <span class="mr-1 select-none inline-block text-xs" title="Artist tags differ between compared posts">⚠️</span>
                                    </template>
                                    <template x-if="getArtistTags(item).length > 0">
                                        <span class="text-gray-400">by <span class="font-mono" :class="hasArtistMismatch() ? 'text-amber-400 font-semibold' : 'text-gray-400'" x-text="getArtistTags(item).join(', ')"></span></span>
                                    </template>
                                    <template x-if="getArtistTags(item).length === 0 && hasArtistMismatch()">
                                        <span class="text-amber-400/90 italic font-mono">(no artist)</span>
                                    </template>
                                </div>

                                <span class="font-mono text-[11px] shrink-0"
                                    x-html="image.formatSpecs(item, [currentPair.a, currentPair.b])">
                                </span>
                            </div>

                            <!-- Card Viewport Container -->
                            <div class="relative w-full flex-1 min-h-0 select-none flex flex-col">

                                <!-- Clickable Card Image Wrapper (Sized to leave exact space for own collapsed summaries) -->
                                <div class="relative w-full flex-none flex items-center justify-center cursor-pointer group"
                                    :style="{ height: getSbsImageWrapperHeight(item) }" @click="openModal(item)">

                                    <div class="relative h-full max-w-full min-h-0 flex items-center justify-center">
                                        <template x-if="!item.fileUrl">
                                            <div class="flex flex-col items-center justify-center p-6 space-y-2">
                                                <div
                                                    class="w-6 h-6 border-2 border-blue-500/20 border-t-blue-500 rounded-full animate-spin">
                                                </div>
                                                <span class="text-[10px] text-gray-500 font-medium">Loading
                                                    image...</span>
                                            </div>
                                        </template>
                                        <template x-if="item.fileUrl">
                                            <img :src="item.fileUrl" class="h-full w-full object-contain block"
                                                @mousemove="handleMouseMove($event, $el, item)"
                                                @mouseenter="isHovering = true" @mouseleave="handleMouseLeave()">
                                        </template>

                                        <load src="/templates/components/expand-image-button.html" />

                                        <div x-show="enableLoupe && isHovering"
                                            class="absolute pointer-events-none border-2 border-blue-500 rounded shadow-2xl z-50 bg-no-repeat bg-gray-800"
                                            :class="!(enableLoupe && isHovering) ? 'hidden' : ''" :style="{
                                                ...getLoupeStyle(item),
                                                left: `${cursorX - loupeSize / 2}px`,
                                                top: `${cursorY - loupeSize / 2}px`,
                                                display: (enableLoupe && isHovering) ? 'block' : 'none'
                                            }">
                                        </div>
                                    </div>
                                </div>

                                <!-- Collapsible Post Description & Sources (Side-by-Side View Overlay - Expanding UP) -->
                                <div class="absolute bottom-0 left-0 right-0 z-10 flex flex-col justify-end pointer-events-auto overflow-hidden"
                                    style="border-bottom-left-radius: 7px; border-bottom-right-radius: 7px;"
                                    @click.stop>
                                    <template x-if="item.description && item.description.trim().length > 0">
                                        <details
                                            :style="!(item.sources && item.sources.length > 0) ? 'border-bottom-left-radius: 7px; border-bottom-right-radius: 7px;' : ''"
                                            class="text-[11px] group border-t border-gray-800 bg-gray-900/90 backdrop-blur-sm overflow-hidden">
                                            <summary
                                                :style="!(item.sources && item.sources.length > 0) ? 'border-bottom-left-radius: 7px; border-bottom-right-radius: 7px;' : ''"
                                                class="h-6.5 bg-gray-900/90 px-2.5 py-1 font-semibold text-gray-400 hover:text-gray-200 cursor-pointer select-none flex items-center justify-between group-open:rounded-b-none">
                                                <span>Description</span>
                                                <span
                                                    class="text-[9px] text-gray-500 group-open:rotate-180 transition-transform">▲</span>
                                            </summary>
                                            <div :style="!(item.sources && item.sources.length > 0) ? 'border-bottom-left-radius: 7px; border-bottom-right-radius: 7px;' : ''"
                                                class="px-2.5 py-2 border-t border-gray-800 text-gray-300 whitespace-pre-wrap wrap-break-word max-h-36 overflow-y-auto bg-gray-950/95"
                                                x-text="item.description"></div>
                                        </details>
                                    </template>

                                    <template x-if="item.sources && item.sources.length > 0">
                                        <details
                                            style="border-bottom-left-radius: 7px; border-bottom-right-radius: 7px;"
                                            class="text-[11px] group border-t border-gray-800 bg-gray-900/90 backdrop-blur-sm overflow-hidden">
                                            <summary
                                                style="border-bottom-left-radius: 7px; border-bottom-right-radius: 7px;"
                                                class="h-6.5 bg-gray-900/90 px-2.5 py-1 font-semibold text-gray-400 hover:text-gray-200 cursor-pointer select-none flex items-center justify-between group-open:rounded-b-none">
                                                <span x-text="`Sources (${item.sources.length})`"></span>
                                                <span
                                                    class="text-[9px] text-gray-500 group-open:rotate-180 transition-transform">▲</span>
                                            </summary>
                                            <div style="border-bottom-left-radius: 7px; border-bottom-right-radius: 7px;"
                                                class="px-2.5 py-2 border-t border-gray-800 space-y-1 max-h-32 overflow-y-auto bg-gray-950/95">
                                                <template x-for="(src, sIdx) in item.sources" :key="sIdx">
                                                    <a :href="src" target="_blank" rel="noopener noreferrer"
                                                        class="block truncate text-blue-400 hover:text-blue-300 hover:underline font-mono text-[10px]"
                                                        x-text="src"></a>
                                                </template>
                                            </div>
                                        </details>
                                    </template>
                                </div>

                            </div>
                        </div>
                    </template>
                </div>

                <!-- 2. SINGLE BOX MODES (SWIPE, DIFF, BLINK) -->
                <div x-show="mode !== 'side-by-side'"
                    class="h-full border border-gray-800 rounded-lg bg-gray-950 flex flex-col relative max-h-full">

                    <!-- Top Header Bar -->
                    <div
                        class="bg-gray-900 px-2.5 py-1.5 flex items-center justify-between text-xs border-b border-gray-800 select-none shrink-0 rounded-t-lg">

                        <!-- SWIPE MODE TOP BAR -->
                        <template x-if="mode === 'swipe'">
                            <div class="w-full grid grid-cols-2 items-center">
                                <!-- Left Side: #A on left, Info specs on right -->
                                <div class="flex items-center justify-between pr-3 border-r border-gray-800/80">
                                    <a :href="`https://e621.net/posts/${currentPair.a.postId}`" target="_blank"
                                        class="font-mono font-bold text-blue-400 hover:text-blue-300 hover:underline"
                                        x-text="`#${currentPair.a.postId}`"></a>
                                    <span class="font-mono text-[11px]"
                                        x-html="image.formatSpecs(currentPair.a, [currentPair.a, currentPair.b])">
                                    </span>
                                </div>

                                <!-- Right Side: Info specs on left, #B on right (Swapped) -->
                                <div class="flex items-center justify-between pl-3">
                                    <span class="font-mono text-[11px]"
                                        x-html="image.formatSpecs(currentPair.b, [currentPair.a, currentPair.b])">
                                    </span>
                                    <a :href="`https://e621.net/posts/${currentPair.b.postId}`" target="_blank"
                                        class="font-mono font-bold text-blue-400 hover:text-blue-300 hover:underline"
                                        x-text="`#${currentPair.b.postId}`"></a>
                                </div>
                            </div>
                        </template>

                        <!-- DIFF MODE TOP BAR -->
                        <template x-if="mode === 'diff'">
                            <div class="w-full flex items-center justify-center font-mono text-xs">
                                <span class="font-bold text-blue-400"
                                    x-text="`#${currentPair.a.postId} - #${currentPair.b.postId}`"></span>
                            </div>
                        </template>

                        <!-- BLINK MODE TOP BAR -->
                        <template x-if="mode === 'blink'">
                            <div class="w-full flex items-center justify-between font-mono">
                                <!-- Left Side: Active # -->
                                <a :href="`https://e621.net/posts/${(blinkShowB ? currentPair.b : currentPair.a).postId}`"
                                    target="_blank" class="font-bold text-blue-400 hover:text-blue-300 hover:underline"
                                    x-text="`#${(blinkShowB ? currentPair.b : currentPair.a).postId}`"></a>
                                <!-- Right Side: Active Image Info Template -->
                                <span class="font-mono text-[11px]"
                                    x-html="image.formatSpecs(blinkShowB ? currentPair.b : currentPair.a, [currentPair.a, currentPair.b])">
                                </span>
                            </div>
                        </template>

                    </div>

                    <div class="relative w-full flex-1 min-h-0 flex items-center justify-center select-none cursor-pointer group"
                        @click="openModal()">

                        <!-- SWIPE MODE -->
                        <div x-show="mode === 'swipe'"
                            class="relative h-full max-w-full min-h-0 flex items-center justify-center cursor-ew-resize"
                            @mousemove="handleSwipeMove($event, $el); handleMouseMove($event, $el, currentPair.a)"
                            @mouseenter="isHovering = true" @mouseleave="handleMouseLeave()">

                            <img :src="currentPair.b.fileUrl"
                                class="h-full w-full object-contain block pointer-events-none">

                            <img :src="currentPair.a.fileUrl"
                                class="absolute h-full w-full object-contain block pointer-events-none"
                                :style="`clip-path: inset(0 ${100 - swipePos}% 0 0);`">

                            <div class="absolute top-0 bottom-0 w-0.5 bg-blue-500 shadow-[0_0_10px_rgba(59,130,246,0.8)] pointer-events-none"
                                :style="`left: ${swipePos}%;`">
                            </div>

                            <load src="/templates/components/expand-image-button.html" />

                            <!-- Swipe Loupe Overlay -->
                            <div x-show="enableLoupe && isHovering"
                                class="absolute pointer-events-none border-2 border-blue-500 rounded shadow-2xl z-50 overflow-hidden bg-gray-800"
                                :class="!(enableLoupe && isHovering) ? 'hidden' : ''" :style="{
                                    width: `${loupeSize}px`,
                                    height: `${loupeSize}px`,
                                    left: `${cursorX - loupeSize / 2}px`,
                                    top: `${cursorY - loupeSize / 2}px`,
                                    display: (enableLoupe && isHovering) ? 'block' : 'none'
                                }">
                                <div class="absolute inset-0 bg-no-repeat bg-gray-800"
                                    :style="getLoupeStyle(currentPair.b)"></div>
                                <div class="absolute inset-0 bg-no-repeat bg-gray-800"
                                    :style="{ ...getLoupeStyle(currentPair.a), ...getSwipeLoupeClipStyle() }"></div>
                            </div>
                        </div>

                        <!-- DIFF MODE -->
                        <div x-show="mode === 'diff'"
                            class="relative h-full max-w-full min-h-0 flex items-center justify-center"
                            @mousemove="handleMouseMove($event, $el, currentPair.a)" @mouseenter="isHovering = true"
                            @mouseleave="handleMouseLeave()">

                            <div class="relative h-full max-w-full min-h-0 flex items-center justify-center bg-black"
                                :style="`filter: brightness(${diffMultiplier});`">
                                <img :src="currentPair.a.fileUrl" class="h-full w-full object-contain block">

                                <img :src="currentPair.b.fileUrl" class="absolute h-full w-full object-contain block"
                                    style="mix-blend-mode: difference;">
                            </div>

                            <load src="/templates/components/expand-image-button.html" />

                            <div x-show="enableLoupe && isHovering"
                                class="absolute pointer-events-none border-2 border-blue-500 rounded shadow-2xl z-50 bg-no-repeat"
                                :class="!(enableLoupe && isHovering) ? 'hidden' : ''" :style="{
                                    ...getDiffLoupeStyle(currentPair.a, currentPair.b),
                                    left: `${cursorX - loupeSize / 2}px`,
                                    top: `${cursorY - loupeSize / 2}px`,
                                    display: (enableLoupe && isHovering) ? 'block' : 'none'
                                }">
                            </div>
                        </div>

                        <!-- BLINK MODE -->
                        <div x-show="mode === 'blink'"
                            class="relative h-full max-w-full min-h-0 flex items-center justify-center"
                            @mousemove="handleMouseMove($event, $el, blinkShowB ? currentPair.b : currentPair.a)" @mouseenter="isHovering = true"
                            @mouseleave="handleMouseLeave()">

                            <img :src="(blinkShowB ? currentPair.b : currentPair.a).fileUrl"
                                class="h-full w-full object-contain block">

                            <load src="/templates/components/expand-image-button.html" />

                            <div x-show="enableLoupe && isHovering"
                                class="absolute pointer-events-none border-2 border-blue-500 rounded shadow-2xl z-50 bg-no-repeat bg-gray-800"
                                :class="!(enableLoupe && isHovering) ? 'hidden' : ''" :style="{
                                    ...getLoupeStyle(blinkShowB ? currentPair.b : currentPair.a),
                                    left: `${cursorX - loupeSize / 2}px`,
                                    top: `${cursorY - loupeSize / 2}px`,
                                    display: (enableLoupe && isHovering) ? 'block' : 'none'
                                }">
                            </div>
                        </div>

                    </div>
                </div>
            </div>
            <!-- UNIFIED ACTION & NAVIGATION BAR -->
            <div x-data="{ showSuperiorPrompt: false }"
                class="bg-gray-900/90 border border-gray-800/80 rounded-lg p-3 shadow-sm relative min-h-15 flex items-center">

                <!-- STAGE 1: Default Classification View -->
                <div x-show="!showSuperiorPrompt" class="grid grid-cols-3 items-center w-full">

                    <!-- Left Column: Empty placeholder to keep center text centered -->
                    <div></div>

                    <!-- Center Column: Instruction Text -->
                    <div class="text-sm font-semibold text-amber-300 text-center whitespace-nowrap">
                        <span>How are these images related?</span>
                    </div>

                    <!-- Right Column: Action Buttons -->
                    <div class="flex items-center justify-end gap-2">
                        <button @click="showSuperiorPrompt = true"
                            class="text-xs px-3 py-1.5 rounded-md font-semibold transition bg-amber-950/60 hover:bg-amber-900/80 text-amber-300 border border-amber-800/80 active:scale-95 shadow-sm whitespace-nowrap cursor-pointer">
                            Duplicate / Inferior
                        </button>

                        <button @click="setRelationship('variant', $data)"
                            :disabled="$store.batches?.activeProject?.projectId === 'exact_duplicates'"
                            :title="$store.batches?.activeProject?.projectId === 'exact_duplicates' ? 'Variants disabled for exact duplicates project' : 'Mark as Variants'"
                            class="text-xs px-3 py-1.5 rounded-md font-semibold transition shadow-sm whitespace-nowrap"
                            :class="$store.batches?.activeProject?.projectId === 'exact_duplicates' 
                                ? 'bg-gray-900/60 text-gray-600 border border-gray-800/60 cursor-not-allowed opacity-60' 
                                : 'bg-purple-950/60 hover:bg-purple-900/80 text-purple-300 border border-purple-800/80 active:scale-95 cursor-pointer'">
                            Variants
                        </button>

                        <button @click="setRelationship('unrelated', $data)"
                            :disabled="$store.batches?.activeProject?.projectId === 'exact_duplicates'"
                            :title="$store.batches?.activeProject?.projectId === 'exact_duplicates' ? 'Unrelated disabled for exact duplicates project' : 'Mark as Unrelated'"
                            class="text-xs px-3 py-1.5 rounded-md font-semibold transition shadow-sm whitespace-nowrap"
                            :class="$store.batches?.activeProject?.projectId === 'exact_duplicates' 
                                ? 'bg-gray-900/60 text-gray-600 border border-gray-800/60 cursor-not-allowed opacity-60' 
                                : 'bg-gray-800/80 hover:bg-gray-700/80 text-gray-300 border border-gray-700/80 active:scale-95 cursor-pointer'">
                            Unrelated
                        </button>
                    </div>
                </div>

                <!-- STAGE 2: Superiority Selection View -->
                <div x-show="showSuperiorPrompt" x-cloak class="grid grid-cols-2 items-center w-full relative">

                    <!-- Center Text: Absolutely centered on top of everything -->
                    <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                        <span class="text-sm font-semibold text-amber-300 text-center">Which image is superior?</span>
                    </div>

                    <!-- Left Half: Button centered under Left Image (25%) -->
                    <div class="flex justify-center">
                        <button
                            :disabled="currentPair.a.isFlagged || currentPair.a.isDeleted"
                            :title="currentPair.a.isFlagged || currentPair.a.isDeleted ? 'Cannot select flagged/deleted post as superior' : ''"
                            @click="setRelationship('duplicate', $data, currentPair.a.postId); showSuperiorPrompt = false"
                            class="w-48 text-xs px-3 py-1.5 rounded-md font-semibold transition border active:scale-95 shadow-md truncate"
                            :class="currentPair.a.isFlagged || currentPair.a.isDeleted 
                                ? 'bg-gray-900/60 text-gray-600 border-gray-800/60 cursor-not-allowed opacity-50' 
                                : 'bg-amber-600 hover:bg-amber-500 text-white border-amber-400 cursor-pointer'">
                            <span x-text="`#${currentPair.a.postId}`"></span>
                        </button>
                    </div>

                    <!-- Right Half: Button centered under Right Image (75%) -->
                    <div class="flex justify-center">
                        <button
                            :disabled="currentPair.b.isFlagged || currentPair.b.isDeleted"
                            :title="currentPair.b.isFlagged || currentPair.b.isDeleted ? 'Cannot select flagged/deleted post as superior' : ''"
                            @click="setRelationship('duplicate', $data, currentPair.b.postId); showSuperiorPrompt = false"
                            class="w-48 text-xs px-3 py-1.5 rounded-md font-semibold transition border active:scale-95 shadow-md truncate"
                            :class="currentPair.b.isFlagged || currentPair.b.isDeleted 
                                ? 'bg-gray-900/60 text-gray-600 border-gray-800/60 cursor-not-allowed opacity-50' 
                                : 'bg-amber-600 hover:bg-amber-500 text-white border-amber-400 cursor-pointer'">
                            <span x-text="`#${currentPair.b.postId}`"></span>
                        </button>
                    </div>

                    <!-- Absolute Cancel Button on Far Right (Does not steal width from grid!) -->
                    <button @click="showSuperiorPrompt = false" title="Cancel selection"
                        class="absolute right-0 text-xs px-2.5 py-1.5 rounded-md text-gray-400 hover:text-white hover:bg-gray-800 transition cursor-pointer">
                        ✕
                    </button>
                </div>

            </div>

        </div>
    </template>
</div>
