<div class="space-y-6 text-sm">

    <!-- Iterates through each ResolutionGraph in resolutionManager -->
    <template x-for="(graph, graphIdx) in resMgr.graphs" :key="graphIdx">
        <div class="bg-gray-950/80 border border-gray-800/80  rounded-lg p-4 space-y-4 shadow-lg">

            <!-- Graph Header Info -->
            <div class="flex items-center justify-between border-b border-gray-800 pb-2">
                <div class="flex items-center gap-2">
                    <span class="font-mono text-xs uppercase font-bold text-gray-400"
                        x-text="`Graph #${graphIdx + 1}`"></span>
                    <span class="text-[10px] px-2 py-0.5 rounded font-bold uppercase tracking-wider" :class="{
                              'bg-blue-950 text-blue-400 border border-blue-800/60': graph.type === 'duplicate',
                              'bg-emerald-950 text-emerald-400 border border-emerald-800/60': graph.type === 'variant',
                              'bg-gray-800 text-gray-400 border border-gray-700': graph.type === 'unrelated',
                              'bg-amber-950 text-amber-400 border border-amber-800/60': graph.type === 'unknown'
                          }" x-text="graph.type"></span>
                </div>
                <span class="text-xs text-gray-500" x-text="`${graph.posts.size} post(s)`"></span>
            </div>

            <!-- Soft/Hard/Info Warning Stack for Graph Scope -->
            <div
                x-data="{ scopeId: graphIdx, graph: graph, getUncopiedMetadataDetails: (g) => getUncopiedMetadataDetails(g), hasUncopiedMetadata: (g) => hasUncopiedMetadata(g) }">
                <load src="/templates/components/warning-banner.html" />
            </div>

            <!-- Table-like Container for Graph Rows -->
            <div class="border border-gray-800 rounded-lg overflow-hidden divide-y divide-gray-800">
                <template x-for="postId in Array.from(graph.posts)" :key="postId">
                    <div x-data="{ post: resMgr.getPost(postId) }">
                        <template x-if="post">
                            <div class="p-4 transition flex flex-col md:flex-row gap-4 items-start justify-between"
                                :class="{
                                     /* Duplicate Theme */
                                     'bg-blue-950/20': graph.type === 'duplicate' && isCanonical(graph, postId),
                                     'bg-amber-950/20': graph.type === 'duplicate' && !isCanonical(graph, postId),
                                     
                                     /* Variant Theme */
                                     'bg-emerald-950/20': graph.type === 'variant' && isCanonical(graph, postId),
                                     'bg-yellow-950/20': graph.type === 'variant' && !isCanonical(graph, postId),

                                     /* Unrelated / Unknown Theme */
                                     'bg-gray-950/40': graph.type === 'unrelated' || graph.type === 'unknown'
                                 }">

                                <!-- Left Section: Single Unified Thumbnail Block -->
                                <div
                                    class="w-full md:w-36 shrink-0 border border-gray-800 rounded-lg overflow-hidden bg-gray-950 flex flex-col">

                                    <!-- 1. Header Bar (ID & Rating with Diff) -->
                                    <div
                                        class="bg-gray-900 px-2 py-1 flex items-center justify-between text-xs border-b border-gray-800">
                                        <a :href="`https://e621.net/posts/${postId}`" target="_blank"
                                            class="font-mono font-bold text-blue-400 hover:underline flex items-center gap-1">
                                            <span x-text="`#${postId}`"></span>
                                            <template x-if="post.original?.isEdited || post.isEdited">
                                                <span class="text-emerald-400 font-bold text-[11px]" title="Post verified / edited in P.A.C.K." style="font-variant-emoji: text;">✓</span>
                                            </template>
                                        </a>

                                        <!-- Rating -->
                                        <div class="flex items-center gap-1 font-mono text-[10px]">
                                            <template x-if="post.getEffectiveRating() === post.original.rating">
                                                <span
                                                    class="px-1.5 py-0.5 rounded font-bold uppercase text-gray-400 bg-gray-800"
                                                    x-text="`${$store.tags?.getRatingLabel(post.getEffectiveRating())}`">
                                                </span>
                                            </template>

                                            <template x-if="post.getEffectiveRating() !== post.original.rating">
                                                <div class="flex items-center gap-0.5"
                                                    :title="`Rating changed from ${post.original.rating}`">
                                                    <span class="text-gray-500 font-bold uppercase"
                                                        x-text="$store.tags?.getRatingLabel(post.original.rating)"></span>
                                                    <span class="text-gray-500">→</span>
                                                    <span class="px-1 py-0.5 rounded font-bold uppercase"
                                                        :class="$store.tags?.getRatingBadgeClass(post.getEffectiveRating())"
                                                        x-text="$store.tags?.getRatingLabel(post.getEffectiveRating())"></span>
                                                </div>
                                            </template>
                                        </div>
                                    </div>

                                    <!-- 2. Image Viewport -->
                                    <div
                                        class="w-full min-h-20 bg-gray-950 flex items-center justify-center overflow-hidden cursor-pointer group"
                                        @click="image.openModal(post)"
                                        :title="post.original.isDeleted ? 'Deleted post' : 'Click to view full image in modal'">
                                        <!-- DELETED Post Placeholder -->
                                        <template x-if="post.original.isDeleted">
                                            <span
                                                class="bg-red-950 text-red-400 border border-red-800/60 px-2.5 py-1 rounded text-xs font-mono font-bold uppercase tracking-wider shadow">DELETED</span>
                                        </template>

                                        <!-- Valid Image -->
                                        <template x-if="!post.original.isDeleted && (post.original.previewUrl || post.original.fileUrl)">
                                            <img :src="post.original.previewUrl || post.original.fileUrl" :alt="`Post #${postId}`"
                                                class="max-h-40 max-w-full object-contain group-hover:brightness-125 transition-[filter] duration-150" />
                                        </template>

                                        <!-- Missing Image -->
                                        <template x-if="!post.original.isDeleted && !post.original.previewUrl && !post.original.fileUrl">
                                            <span class="text-gray-600 text-xs font-mono text-center">No Image</span>
                                        </template>
                                    </div>

                                    <!-- 3. Image Info Bar -->
                                    <div
                                        class="bg-gray-900 border-t border-gray-800 px-2 py-1 text-[10px] text-gray-500 text-center font-mono">
                                        <span class="font-mono text-[10px]"
                                            x-html="image.formatSpecs(post.original, graph.type === 'duplicate' ? Array.from(graph.posts).map(id => resMgr.getPost(id)?.original).filter(Boolean) : null)">
                                        </span>
                                    </div>

                                    <!-- 4. Status Badge -->
                                    <template x-if="graph.type === 'duplicate'">
                                        <div>
                                            <div x-show="isCanonical(graph, postId)"
                                                class="border-t border-gray-800 bg-blue-950/60 text-blue-300 font-bold text-[10px] py-1 text-center uppercase tracking-wider">
                                                KEEP
                                            </div>
                                            <div x-show="!isCanonical(graph, postId)"
                                                class="border-t border-amber-900/60 bg-amber-950/60 text-amber-400 font-bold text-[10px] py-1 text-center uppercase tracking-wider">
                                                FLAG
                                            </div>
                                        </div>
                                    </template>

                                    <template x-if="graph.type === 'variant'">
                                        <div>
                                            <div x-show="isCanonical(graph, postId)"
                                                class="border-t border-gray-800 bg-emerald-950/60 text-emerald-300 font-bold text-[10px] py-1 text-center uppercase tracking-wider">
                                                PARENT
                                            </div>
                                            <div x-show="!isCanonical(graph, postId)"
                                                class="border-t border-yellow-900/60 bg-yellow-950/60 text-yellow-400 font-bold text-[10px] py-1 text-center uppercase tracking-wider">
                                                CHILD
                                            </div>
                                        </div>
                                    </template>

                                </div> <!-- Middle Section: Diff UI (Parent/Pools, Tags, Description, Sources) -->
                                <div class="flex-1 w-full min-w-0 flex flex-col gap-3 text-xs">

                                    <!-- Parent Post & Pools Line (Positioned ABOVE Tags section, no enclosing box container) -->
                                    <div class="flex flex-wrap items-center gap-4 text-xs font-mono">
                                        <!-- Left: Parent Column (Fixed w-56 width to accommodate 8-digit post IDs & action buttons without shift) -->
                                        <div class="w-56 shrink-0 flex items-center gap-1.5 min-h-6">
                                            <span class="text-gray-400 font-semibold font-sans">Parent:</span>

                                            <!-- Superior Post Parent Controls -->
                                            <template x-if="isCanonical(graph, postId)">
                                                <div class="flex items-center gap-1.5">
                                                    <!-- Active Parent (Original or Modified) -->
                                                    <template x-if="post.parentId">
                                                        <div class="flex items-center gap-1 h-6">
                                                            <a :href="`https://e621.net/posts/${post.parentId}`"
                                                                target="_blank"
                                                                :class="post.parentId === post.original?.parentId ? 'bg-gray-900 hover:bg-gray-800 text-gray-300 hover:text-white border-gray-700' : 'bg-green-950/80 hover:bg-green-900/80 text-green-300 hover:text-green-200 border-green-700/80 font-medium'"
                                                                class="border px-1.5 py-0.5 rounded text-[11px] font-mono transition">
                                                                <span
                                                                    x-text="post.parentId === post.original?.parentId ? '' : '+ '"></span>#<span
                                                                    x-text="post.parentId"></span>
                                                            </a>

                                                            <button @click="removeHeadParent(graph)"
                                                                title="Remove parent"
                                                                class="text-gray-500 hover:text-red-400 px-1 py-0.5 text-[10px] rounded hover:bg-red-950/50 transition cursor-pointer">
                                                                ✕
                                                            </button>

                                                            <!-- Reset button if replacing an existing original parent -->
                                                            <template
                                                                x-if="post.original?.parentId && post.parentId !== post.original.parentId">
                                                                <button @click="resetHeadParent(graph)"
                                                                    title="Reset to original parent"
                                                                    class="text-[10px] text-amber-400 hover:text-amber-300 hover:underline font-mono cursor-pointer">
                                                                    ↺ Reset
                                                                </button>
                                                            </template>
                                                        </div>
                                                    </template>

                                                    <!-- Removed Original Parent (Red Strikethrough & Reset outside the box) -->
                                                    <template x-if="!post.parentId && post.original?.parentId">
                                                        <div class="flex items-center gap-1.5 h-6">
                                                            <span
                                                                class="line-through text-red-300 bg-red-950/20 px-1.5 py-0.5 rounded border border-red-900/40 opacity-85 text-[11px] font-mono">#<span
                                                                    x-text="post.original.parentId"></span></span>
                                                            <button @click="resetHeadParent(graph)"
                                                                title="Restore original parent"
                                                                class="text-[10px] text-amber-400 hover:text-amber-300 hover:underline font-mono cursor-pointer">
                                                                ↺ Reset
                                                            </button>
                                                        </div>
                                                    </template>

                                                    <!-- No Parent Fallback (when original was null and none added) -->
                                                    <template x-if="!post.parentId && !post.original?.parentId">
                                                        <span
                                                            class="text-gray-600 italic font-sans text-[11px]">(None)</span>
                                                    </template>
                                                </div>
                                            </template>

                                            <!-- Inferior Post Parent Display -->
                                            <template x-if="!isCanonical(graph, postId) && graph.head">
                                                <div class="flex items-center gap-1.5">
                                                    <template x-if="!post.parentId">
                                                        <span
                                                            class="text-gray-600 italic font-sans text-[11px]">(None)</span>
                                                    </template>
                                                    <template x-if="post.parentId">
                                                        <div class="h-6 flex items-center">
                                                            <!-- Already in superior post: plain text, no controls -->
                                                            <template x-if="headHasParent(graph, post.parentId)">
                                                                <span class="text-gray-400 font-mono text-[11px]">#<span
                                                                        x-text="post.parentId"></span></span>
                                                            </template>
                                                            <!-- Not in superior post: + #<id> button -->
                                                            <template x-if="!headHasParent(graph, post.parentId)">
                                                                <button @click="copyParentToHead(graph, post.parentId)"
                                                                    title="Transfer parent to superior post"
                                                                    class="bg-gray-800 hover:bg-gray-700 text-blue-300 hover:text-blue-200 border border-gray-700 text-[11px] px-1.5 py-0.5 rounded transition font-mono cursor-pointer">
                                                                    + #<span x-text="post.parentId"></span>
                                                                </button>
                                                            </template>
                                                        </div>
                                                    </template>
                                                </div>
                                            </template>
                                        </div>

                                        <!-- Right: Pools Column (Fixed distance from Parent, height locked for 0 micro-shifts) -->
                                        <div class="flex items-center gap-1.5 min-w-0 min-h-6">
                                            <span class="text-gray-400 font-semibold font-sans">Pools:</span>

                                            <!-- Superior Post Pools Display -->
                                            <template x-if="isCanonical(graph, postId)">
                                                <div class="flex items-center gap-1">
                                                    <!-- No pools fallback -->
                                                    <template
                                                        x-if="(!post.poolIds || post.poolIds.length === 0) && (!post._removedPools || post._removedPools.length === 0)">
                                                        <span
                                                            class="text-gray-600 italic font-sans text-[11px]">(None)</span>
                                                    </template>

                                                    <!-- Active Pools on Superior Post -->
                                                    <template x-if="post.poolIds && post.poolIds.length > 0">
                                                        <div class="flex flex-wrap items-center gap-1">
                                                            <template x-for="poolId in post.poolIds" :key="poolId">
                                                                <div class="flex items-center gap-1 h-6">
                                                                    <!-- Original pool (standard blue badge) vs Moved-over pool (green badge) -->
                                                                    <a :href="`https://e621.net/pools/${poolId}`"
                                                                        target="_blank"
                                                                        :class="post.original?.poolIds?.includes(poolId) ? 'bg-gray-900 hover:bg-gray-800 text-blue-400 hover:text-blue-300 border-gray-800' : 'bg-green-950/80 hover:bg-green-900/80 text-green-300 hover:text-green-200 border-green-700/80 font-medium'"
                                                                        class="border text-[11px] px-1.5 py-0.5 rounded transition">
                                                                        <span
                                                                            x-text="post.original?.poolIds?.includes(poolId) ? '' : '+ '"></span>Pool
                                                                        #<span x-text="poolId"></span>
                                                                    </a>

                                                                    <button @click="removePoolFromHead(graph, poolId)"
                                                                        title="Remove superior post from pool"
                                                                        class="text-gray-500 hover:text-red-400 px-1 py-0.5 text-[10px] rounded hover:bg-red-950/50 transition cursor-pointer">
                                                                        ✕
                                                                    </button>
                                                                </div>
                                                            </template>
                                                        </div>
                                                    </template>

                                                    <!-- Removed Original Pools on Superior Post (Red Strikethrough & Restore +) -->
                                                    <template
                                                        x-if="post._removedPools && post._removedPools.length > 0">
                                                        <div class="flex flex-wrap items-center gap-1">
                                                            <template x-for="poolId in post._removedPools"
                                                                :key="'removed_pool:' + poolId">
                                                                <div
                                                                    class="flex items-center gap-1 bg-red-950/20 px-1.5 py-0.5 rounded border border-red-900/40 opacity-85 h-6">
                                                                    <span
                                                                        class="line-through text-red-300 text-[11px]">Pool
                                                                        #<span x-text="poolId"></span></span>
                                                                    <button @click="restorePoolToHead(graph, poolId)"
                                                                        title="Restore superior post to pool"
                                                                        class="text-emerald-400 hover:text-emerald-300 font-bold px-1 text-[10px] cursor-pointer">
                                                                        +
                                                                    </button>
                                                                </div>
                                                            </template>
                                                        </div>
                                                    </template>
                                                </div>
                                            </template>

                                            <!-- Inferior Post Pools Display (Disappears without a trace when moved) -->
                                            <template x-if="!isCanonical(graph, postId) && graph.head">
                                                <div class="flex flex-wrap items-center gap-1">
                                                    <template
                                                        x-if="getAvailableInferiorPools(graph, post).length === 0">
                                                        <span
                                                            class="text-gray-600 italic font-sans text-[11px]">(None)</span>
                                                    </template>
                                                    <template x-for="poolId in getAvailableInferiorPools(graph, post)"
                                                        :key="poolId">
                                                        <div class="h-6 flex items-center">
                                                            <button
                                                                @click="copyPoolToHead(graph, poolId, post.original.postId)"
                                                                title="Add superior post to pool"
                                                                class="bg-gray-800 hover:bg-gray-700 text-blue-300 hover:text-blue-200 border border-gray-700 text-[11px] px-1.5 py-0.5 rounded transition font-mono whitespace-nowrap cursor-pointer">
                                                                ↑ Pool #<span x-text="poolId"></span>
                                                            </button>
                                                        </div>
                                                    </template>
                                                </div>
                                            </template>
                                        </div>
                                    </div>

                                    <!-- Keep / Parent / Edit Diff View -->
                                    <template
                                        x-if="graph.type === 'unrelated' || isCanonical(graph, postId) || graph.type === 'variant'">
                                        <div class="space-y-2">
                                            <!-- Categorized & Sorted Tag Edits -->
                                            <div>
                                                <span class="text-gray-400 font-semibold block mb-1">Tags:</span>
                                                <div class="flex flex-wrap gap-1">
                                                    <template
                                                        x-for="tag in $store.tags?.getSortedTags([...post.tags, ...getRemovedTags(post)], post)"
                                                        :key="`${tag.category}:${tag.name}`">
                                                        <span
                                                            class="px-1.5 py-0.5 rounded text-[11px] transition-colors"
                                                            :style="$store.tags?.getTagStyle(tag.category)" :class="{
                                                                   'bg-green-950/80 border border-green-700/60': getAddedTags(post).includes(tag.name),
                                                                   'bg-red-950/60 line-through border border-red-900/60 opacity-70': getRemovedTags(post).includes(tag.name),
                                                                   'bg-gray-800/90': !getAddedTags(post).includes(tag.name) && !getRemovedTags(post).includes(tag.name)
                                                               }">
                                                            <span
                                                                x-text="getAddedTags(post).includes(tag.name) ? `+ ${tag.name}` : tag.name"></span>
                                                        </span>
                                                    </template>
                                                </div>
                                            </div>
                                        </div>
                                    </template>

                                    <!-- Description Section with Context Controls -->
                                    <div>
                                        <div class="flex items-center justify-between mb-1">
                                            <span class="text-gray-400 font-semibold">Description:</span>

                                            <!-- Controls for Superior Post (Reset) -->
                                            <template x-if="isCanonical(graph, postId) && isDescriptionEdited(post)">
                                                <button @click="resetHeadDescription(graph)"
                                                    class="text-[10px] text-amber-400 hover:text-amber-300 hover:underline font-mono cursor-pointer">
                                                    ↺ Reset to Original
                                                </button>
                                            </template>

                                            <!-- Controls for Flagged Posts (Transfer to Superior Post) -->
                                            <template
                                                x-if="!isCanonical(graph, postId) && graph.head && post.description">
                                                <button @click="copyDescriptionToHead(graph, post.original.postId)"
                                                    :disabled="resMgr.getPost(graph.head)?.description === post.description"
                                                    title="Transfer description to superior post"
                                                    class="text-[10px] bg-gray-800 hover:bg-gray-700 text-blue-300 hover:text-blue-200 disabled:opacity-40 disabled:cursor-not-allowed border border-gray-700 rounded px-1.5 py-0.5 transition flex items-center gap-1 font-mono cursor-pointer">
                                                    <span>📋 Transfer</span>
                                                </button>
                                            </template>
                                        </div>

                                        <div class="p-2 rounded border text-xs max-h-20 overflow-y-auto"
                                            :class="isDescriptionEdited(post) ? 'bg-green-950/40 border-green-800/60 text-green-200' : 'bg-gray-950 border-gray-800 text-gray-400'">
                                            <p x-text="post.description || '(No description)'"
                                                class="whitespace-pre-wrap wrap-break-word"></p>
                                        </div>
                                    </div>

                                    <!-- Sources Section with Context Controls -->
                                    <div class="min-w-0">
                                        <span class="text-gray-400 font-semibold block mb-1">Sources:</span>
                                        <ul class="flex flex-col gap-1 font-mono text-[11px] break-all min-w-0">
                                            <template
                                                x-if="(!post.sources || post.sources.length === 0) && (!post._removedSources || post._removedSources.length === 0)">
                                                <li class="text-gray-600 italic font-sans">(No sources)</li>
                                            </template>

                                            <!-- Active Sources -->
                                            <template x-for="src in post.sources" :key="src">
                                                <li
                                                    class="flex items-center justify-between gap-2 group bg-gray-950/50 p-1 rounded border border-gray-800/60 h-7 min-w-0">
                                                    <div class="flex items-center gap-1.5 min-w-0 flex-1">
                                                        <span class="shrink-0"
                                                            :class="post.original.sources?.some(s => normalizeUrl(s) === normalizeUrl(src)) ? 'text-gray-500' : 'text-green-400 font-medium'"
                                                            x-text="post.original.sources?.some(s => normalizeUrl(s) === normalizeUrl(src)) ? '•' : '+'"></span>
                                                        <span class="truncate" :title="src"
                                                            :class="post.original.sources?.some(s => normalizeUrl(s) === normalizeUrl(src)) ? 'text-gray-400' : 'text-green-300'"
                                                            x-text="src"></span>
                                                    </div>

                                                    <!-- Superior Post: Remove Source Button (Square button, SVG rotates 45deg) -->
                                                    <template x-if="isCanonical(graph, postId)">
                                                        <button @click="removeSourceFromHead(graph, src)"
                                                            title="Remove source from superior post"
                                                            class="w-5 h-5 flex items-center justify-center rounded text-gray-500 hover:text-red-400 hover:bg-red-950/60 border border-transparent hover:border-red-900/60 transition-colors shrink-0 cursor-pointer">
                                                            <svg class="w-3 h-3 fill-current transition-transform duration-300 transform rotate-0"
                                                                viewBox="0 0 12 12" xmlns="http://www.w3.org/2000/svg">
                                                                <path
                                                                    d="M2.22 2.22a.75.75 0 0 1 1.06 0L6 4.94l2.72-2.72a.75.75 0 1 1 1.06 1.06L7.06 6l2.72 2.72a.75.75 0 1 1-1.06 1.06L6 7.06l-2.72 2.72a.75.75 0 0 1-1.06-1.06L4.94 6 2.22 3.28a.75.75 0 0 1 0-1.06z" />
                                                            </svg>
                                                        </button>
                                                    </template>

                                                    <!-- Flagged Post: Transfer Source Button or Plain (No button/badge if already in superior post) -->
                                                    <template x-if="!isCanonical(graph, postId) && graph.head">
                                                        <div class="w-24 shrink-0 flex items-center justify-end">
                                                            <template x-if="!headHasSource(graph, src)">
                                                                <button @click="addSourceToHead(graph, src)"
                                                                    title="Transfer source to superior post"
                                                                    class="text-[10px] bg-gray-800 hover:bg-gray-700 text-blue-300 hover:text-blue-200 border border-gray-700 rounded px-1.5 py-0.5 transition font-mono whitespace-nowrap block text-center w-full cursor-pointer">
                                                                    + Transfer
                                                                </button>
                                                            </template>
                                                        </div>
                                                    </template>
                                                </li>
                                            </template>

                                            <!-- Removed/Deleted Sources on Superior Post (Red Strikethrough & Restore via SVG rotated 45deg -> +) -->
                                            <template
                                                x-if="isCanonical(graph, postId) && post._removedSources && post._removedSources.length > 0">
                                                <template x-for="src in post._removedSources" :key="'removed:' + src">
                                                    <li
                                                        class="flex items-center justify-between gap-2 group bg-red-950/20 p-1 rounded border border-red-900/40 opacity-85 h-7 min-w-0">
                                                        <div class="flex items-center gap-1.5 min-w-0 flex-1">
                                                            <span
                                                                class="text-red-400 font-bold select-none shrink-0">•</span>
                                                            <span
                                                                class="truncate line-through text-red-300/90 font-mono"
                                                                :title="src" x-text="src"></span>
                                                        </div>

                                                        <button @click="restoreSourceToHead(graph, src)"
                                                             title="Restore source to superior post"
                                                            class="w-5 h-5 flex items-center justify-center rounded text-emerald-400/90 hover:text-emerald-300 hover:bg-emerald-950/60 border border-transparent hover:border-emerald-800/80 transition-colors shrink-0 cursor-pointer">
                                                            <svg class="w-3 h-3 fill-current transition-transform duration-300 transform rotate-45"
                                                                viewBox="0 0 12 12" xmlns="http://www.w3.org/2000/svg">
                                                                <path
                                                                    d="M2.22 2.22a.75.75 0 0 1 1.06 0L6 4.94l2.72-2.72a.75.75 0 1 1 1.06 1.06L7.06 6l2.72 2.72a.75.75 0 1 1-1.06 1.06L6 7.06l-2.72 2.72a.75.75 0 0 1-1.06-1.06L4.94 6 2.22 3.28a.75.75 0 0 1 0-1.06z" />
                                                            </svg>
                                                        </button>
                                                    </li>
                                                </template>
                                            </template>
                                        </ul>
                                    </div>

                                </div>

                                <!-- Right Section: Action Controls -->
                                <div
                                    class="w-full md:w-auto flex md:flex-col justify-end gap-2 pt-2 md:pt-0 border-t md:border-t-0 border-gray-800">
                                    <template
                                        x-if="graph.type === 'unrelated' || isCanonical(graph, postId) || graph.type === 'variant'">
                                        <button @click="applyChanges(postId)"
                                            :disabled="post.isApplied || isSubmitting(postId) || !hasChangesToApply(post) || (warnings && warnings.isBlocked(graphIdx, { graph: graph, getUncopiedMetadataDetails: (g) => getUncopiedMetadataDetails(g), hasUncopiedMetadata: (g) => hasUncopiedMetadata(g) }))"
                                            :title="post.isApplied ? 'Changes have been successfully applied to e621.' : (!hasChangesToApply(post) ? 'No pending changes to apply for this post.' : ((warnings && warnings.isBlocked(graphIdx, { graph: graph, getUncopiedMetadataDetails: (g) => getUncopiedMetadataDetails(g), hasUncopiedMetadata: (g) => hasUncopiedMetadata(g) })) ? 'Clear or dismiss warnings before applying changes.' : ''))"
                                            class="w-full md:w-28 font-semibold text-xs px-3 py-2 rounded shadow transition flex items-center justify-center gap-1.5"
                                            :class="post.isApplied
                                                    ? 'bg-emerald-950/70 text-emerald-400 border border-emerald-700/50 cursor-default'
                                                    : (isSubmitting(postId)
                                                        ? 'bg-blue-800 text-blue-200 cursor-wait opacity-80 border border-blue-600'
                                                        : (!hasChangesToApply(post) || (warnings && warnings.isBlocked(graphIdx, { graph: graph, getUncopiedMetadataDetails: (g) => getUncopiedMetadataDetails(g), hasUncopiedMetadata: (g) => hasUncopiedMetadata(g) }))
                                                            ? 'bg-gray-800 text-gray-500 cursor-not-allowed border border-gray-700/60'
                                                            : 'bg-blue-600 hover:bg-blue-500 text-white cursor-pointer'))">
                                            <template x-if="isSubmitting(postId)">
                                                <svg class="animate-spin h-3.5 w-3.5 text-white"
                                                    xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                                    <circle class="opacity-25" cx="12" cy="12" r="10"
                                                        stroke="currentColor" stroke-width="4"></circle>
                                                    <path class="opacity-75" fill="currentColor"
                                                        d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                                                    </path>
                                                </svg>
                                            </template>
                                            <template x-if="!isSubmitting(postId)">
                                                <span style="font-variant-emoji: text;">✓</span>
                                            </template>
                                            <span
                                                x-text="post.isApplied ? 'Applied' : (isSubmitting(postId) ? 'Applying...' : 'Apply')"></span>
                                        </button>
                                    </template>

                                    <template x-if="graph.type === 'duplicate' && !isCanonical(graph, postId)">
                                        <button @click="submitFlag(postId, graph.head)"
                                            :disabled="post.isFlagged || post.original?.isFlagged || post.original?.isDeleted || isSubmitting(postId) || !$store.auth?.e621User"
                                            :title="(post.isFlagged || post.original?.isFlagged) ? 'Post has been successfully flagged as inferior on e621.' : (post.original?.isDeleted ? 'Post is already deleted.' : (!$store.auth?.e621User ? 'Log in with e621 credentials to submit flags.' : ''))"
                                            class="w-full md:w-28 font-semibold text-xs px-3 py-2 rounded shadow transition flex items-center justify-center gap-1.5"
                                            :class="(post.isFlagged || post.original?.isFlagged)
                                                    ? 'bg-emerald-950/70 text-emerald-400 border border-emerald-700/50 cursor-default'
                                                    : ((post.original?.isDeleted || !$store.auth?.e621User)
                                                        ? 'bg-gray-800 text-gray-500 cursor-not-allowed border border-gray-700/60'
                                                        : (isSubmitting(postId)
                                                            ? 'bg-amber-800 text-amber-200 cursor-wait opacity-80 border border-amber-600'
                                                            : 'bg-amber-600 hover:bg-amber-500 text-white cursor-pointer'))">
                                            <template x-if="isSubmitting(postId)">
                                                <svg class="animate-spin h-3.5 w-3.5 text-white"
                                                    xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                                    <circle class="opacity-25" cx="12" cy="12" r="10"
                                                        stroke="currentColor" stroke-width="4"></circle>
                                                    <path class="opacity-75" fill="currentColor"
                                                        d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                                                    </path>
                                                </svg>
                                            </template>
                                            <template x-if="!isSubmitting(postId)">
                                                <span style="font-variant-emoji: text;"
                                                    x-text="(post.isFlagged || post.original?.isFlagged) ? '✓' : '🚩'"></span>
                                            </template>
                                            <span
                                                x-text="(post.isFlagged || post.original?.isFlagged) ? 'Flagged' : (isSubmitting(postId) ? 'Flagging...' : 'Flag')"></span>
                                        </button>
                                    </template>
                                </div>

                            </div>
                        </template>
                    </div>
                </template>
            </div>

        </div>
    </template>

</div>
