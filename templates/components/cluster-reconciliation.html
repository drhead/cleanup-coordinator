<div class="bg-gray-950/80 border border-gray-800/80 rounded-lg p-4 space-y-4 text-gray-200 text-xs">

    <!-- 1. TOP ROW: Duplicate Graph Selection Buttons -->
    <div class="flex items-center gap-2 overflow-x-auto pb-2 border-b border-gray-800/80">
        <span class="text-xs font-bold text-gray-400 uppercase tracking-wider mr-2 shrink-0">Duplicate Graphs:</span>
        <template x-for="(graph, idx) in duplicateGraphs" :key="idx">
            <button @click="selectGraph(idx)"
                    class="text-xs px-3 py-1.5 rounded-md font-mono font-semibold transition border flex items-center gap-2 shadow-sm shrink-0"
                    :class="activeGraphIndex === idx 
                        ? 'bg-amber-900/90 text-amber-200 border-amber-400 ring-1 ring-amber-400/50 shadow-md' 
                        : 'bg-amber-950/40 text-amber-400/80 border-amber-900/60 hover:bg-amber-900/50 hover:text-amber-300'">
                
                <!-- Graph Number Label -->
                <span x-text="`#${idx + 1}`"></span>

                <!-- Dot indicator container (one dot per post in graph) -->
                <div class="flex items-center gap-1 ml-0.5">
                    <!-- Fallback to (graph.posts || graph) depending on your data shape -->
                    <template x-for="post in (graph.posts || graph.nodes || graph)" :key="post.id || post">
                        <span class="w-2 h-2 rounded-full transition-colors"
                            :class="activeGraphIndex === idx ? 'bg-amber-300' : 'bg-amber-500/70'"></span>
                    </template>
                </div>

            </button>
        </template>
    </div>

    <!-- 2. STRIPPED-DOWN IMAGES ROW -->
    <template x-if="currentGraph">
        <div class="space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 relative items-center">
                <template x-for="pId in orderedPostIds" :key="pId">
                    <div class="space-y-2 relative flex flex-col justify-between transition">
                        
                        <!-- ID Badge Header -->
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-2">
                                <div class="text-xs font-mono font-bold px-2.5 py-1 rounded transition flex items-center gap-1.5"
                                     :class="selectedSuperiorId === pId ? 'bg-blue-600 text-white shadow' : 'bg-gray-800/80 text-gray-400'">
                                    <span x-text="`Post #${pId}`"></span>
                                    
                                    <template x-if="selectedSuperiorId === pId">
                                        <span class="text-[9px] uppercase font-black bg-blue-800 px-1 py-0.5 rounded text-blue-200">Kept (Superior)</span>
                                    </template>
                                    <template x-if="selectedSuperiorId !== pId">
                                        <span class="text-[9px] uppercase font-black bg-gray-900 px-1 py-0.5 rounded text-gray-500">Inferior</span>
                                    </template>
                                </div>
                            </div>

                            <a :href="`https://e621.net/posts/${pId}`" target="_blank" rel="noopener noreferrer"
                               class="text-[11px] font-semibold text-gray-400 hover:text-gray-200 hover:underline flex items-center gap-0.5">
                                <span>e621</span>
                                <span class="text-[9px]">&nearr;</span>
                            </a>
                        </div>

                        <!-- Borderless Clean Image Frame -->
                        <div class="w-full h-72 bg-black/60 rounded-md border border-gray-800/60 flex items-center justify-center overflow-hidden">
                            <img :src="getLocalClusterPost(pId)?.fileUrl" class="max-h-full max-w-full object-contain rounded">
                        </div>
                    </div>
                </template>
            </div>

            <!-- UNIFIED ACTION & NAVIGATION BAR (Directly below Image Display) -->
            <div class="bg-gray-900/90 border border-gray-800/80 rounded-lg p-3 flex flex-col md:flex-row items-center justify-between gap-3 shadow-sm">
                
                <!-- Status Info -->
                <div class="text-xs text-gray-400 font-mono w-full md:w-1/4 text-left">
                    <template x-if="rhsPostIds.length > 0">
                        <span>Post <span class="font-bold text-gray-200" x-text="activeRhsIndex + 1"></span> of <span class="font-bold text-gray-200" x-text="rhsPostIds.length"></span> in Graph <span class="font-bold text-gray-200" x-text="activeGraphIndex + 1"></span></span>
                    </template>
                </div>

                <!-- Centered Instruction Text -->
                <div class="text-xs text-gray-200 font-medium text-center flex-1">
                    <span class="text-gray-300">Review tag transfers below, then advance to proceed.</span>
                </div>

                <!-- Navigation Action Button -->
                <div class="flex items-center justify-end w-full md:w-1/4">
                    <button @click="advance($data)"
                            class="bg-blue-600 hover:bg-blue-500 text-white text-xs px-4 py-1.5 rounded-md font-bold transition shadow flex items-center gap-2">
                        <span x-text="nextButtonLabel"></span>
                        <span>→</span>
                    </button>
                </div>
            </div>
        </div>
    </template>

    <!-- 3. TAG CARDS (Retagging Interface) -->
    <template x-if="lhsPost">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
            
            <!-- LHS: Kept Post Tag Card -->
            <div class="bg-gray-950/80 border border-gray-800/80 rounded-lg p-3.5 text-xs space-y-3 flex flex-col justify-between shadow-sm">
                <div class="space-y-3">
                    <!-- Post Header Line -->
                    <div class="flex items-center justify-between">
                        <div class="flex items-center space-x-2">
                            <span class="px-1.5 py-0.5 rounded text-[11px] font-bold font-mono transition-colors"
                                  :class="$store.tags.getRatingBadgeClass(getEffectiveLhsRating())"
                                  x-text="$store.tags.getRatingLabel(getEffectiveLhsRating())"></span>

                            <a :href="`https://e621.net/posts/${lhsPost.post_id}`" target="_blank"
                               class="font-mono font-bold text-blue-400 hover:text-blue-300 hover:underline text-sm flex items-center space-x-1">
                                <span x-text="`#${lhsPost.post_id}`"></span>
                                <span class="text-gray-600 text-xs">&nearr;</span>
                            </a>

                            <template x-if="lhsPost.parent_id">
                                <a :href="`https://e621.net/posts/${lhsPost.parent_id}`" target="_blank"
                                   class="font-mono text-[11px] text-gray-400 hover:text-blue-300 hover:underline">
                                    (Parent: #<span x-text="lhsPost.parent_id"></span>)
                                </a>
                            </template>
                        </div>

                        <div class="flex items-center space-x-2">
                            <span class="font-mono text-[11px]"
                                :class="image.isUniform(cluster.posts, lhsPost) ? 'text-gray-600' : 'text-gray-400'"
                                x-text="image.formatSpecs(lhsPost)">
                            </span>

                            <template x-if="lhsPost.is_deleted">
                                <span class="bg-red-950 text-red-400 border border-red-800/50 px-1.5 py-0.5 rounded text-[10px] font-bold">DELETED</span>
                            </template>
                            <template x-if="!lhsPost.is_deleted && lhsPost.is_flagged">
                                <span class="bg-amber-950 text-amber-400 border border-amber-800/50 px-1.5 py-0.5 rounded text-[10px] font-bold">FLAGGED</span>
                            </template>
                        </div>
                    </div>

                    <!-- Post Pools List -->
                    <template x-if="lhsPost.pool_ids && lhsPost.pool_ids.length > 0">
                        <div class="flex flex-wrap items-center gap-1.5 pt-1">
                            <span class="text-gray-500 font-semibold text-[10px] uppercase tracking-wider">Pools:</span>
                            <template x-for="poolId in lhsPost.pool_ids" :key="poolId">
                                <a :href="`https://e621.net/pools/${poolId}`" target="_blank"
                                   class="bg-gray-900 hover:bg-gray-800 text-blue-300 border border-gray-800 text-[10px] px-1.5 py-0.5 rounded font-mono transition">
                                    Pool #<span x-text="poolId"></span>
                                </a>
                            </template>
                        </div>
                    </template>

                    <!-- Interactive LHS Tag Cloud -->
                    <div class="bg-gray-900/90 p-2.5 rounded-md border border-gray-800/80 space-y-1.5">
                        <div class="flex flex-wrap gap-x-1 gap-y-1">
                            <template x-for="tag in getSortedTags(lhsTags)" :key="tag.category + ':' + tag.name">
                                <span class="font-mono text-[11px] leading-tight inline-flex items-center px-1 rounded border border-transparent select-none transition-all duration-150 ease-in-out"
                                    :class="tagpill.getTagClasses(tag, lhsPost, 'lhs', { hoveredImplicationData, newTags })"
                                    :style="tagpill.getTagStyle(tag, lhsPost, hoveredImplicationData)"
                                    :title="tagpill.getTagTitle(tag.name, lhsPost)"
                                    @click="if (!tagpill.isTagLocked(tag.name, lhsPost)) removeTagWithImplicators(tag)"
                                    @mouseenter="if (!tagpill.isTagLocked(tag.name, lhsPost)) hoveredImplicationData = getImplicationChain(lhsPost.post_id, tag.name, lhsTags)"
                                    @mouseleave="hoveredImplicationData = null">
                                    
                                    <span x-text="tag.name"></span>

                                    <!-- Implied Tag Marker -->
                                    <span x-show="isImpliedTag(tag.name, lhsTags)" 
                                        class="text-emerald-400 font-bold text-[9px] ml-0.5 select-none" 
                                        title="Implied tag">i</span>

                                    <!-- Locked Tag Indicator vs. Remove Icon -->
                                    <template x-if="tagpill.isTagLocked(tag.name, lhsPost)">
                                        <svg class="w-2.5 h-2.5 ml-1 text-gray-400/80 inline" fill="currentColor" viewBox="0 0 20 20">
                                            <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd" />
                                        </svg>
                                    </template>
                                    <template x-if="!tagpill.isTagLocked(tag.name, lhsPost)">
                                        <span class="text-[9px] text-gray-400 hover:text-red-400 ml-1 cursor-pointer">×</span>
                                    </template>
                                </span>
                            </template>
                        </div>

                        <!-- Removed Tags -->
                        <template x-if="removedLhsTags.length > 0">
                            <div class="space-y-1 pt-1.5 border-t border-gray-800/60">
                                <div class="flex flex-wrap gap-x-1 gap-y-1">
                                    <template x-for="tag in getSortedTags(removedLhsTags)" :key="tag.category + ':' + tag.name">
                                        <span @click="addTagWithImplications(tag.name)"
                                            class="font-mono text-[11px] leading-tight inline-flex items-center px-1.5 py-0.5 rounded bg-gray-950 text-gray-600 line-through border border-gray-800 cursor-pointer hover:text-gray-300 hover:no-underline"
                                            title="Click to restore">
                                            <span x-text="tag.name"></span>
                                        </span>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- Rating Selector & Custom Tag Input Controls -->
                <div class="bg-gray-900/90 border border-gray-800/80 rounded-md p-2.5 flex items-center justify-between gap-3 mt-3">
                    <div class="flex items-center gap-2">
                        <span class="text-[11px] font-semibold text-gray-400">Rating:</span>
                        <div class="flex bg-gray-900 border border-gray-800 rounded p-0.5 gap-1">
                            <template x-for="r in ['s', 'q', 'e']" :key="r">
                                <button @click="activeRating = r"
                                        class="text-xs px-2 py-0.5 rounded font-bold uppercase transition"
                                        :class="activeRating === r 
                                            ? ($store.tags.getRatingBadgeClass(r)) 
                                            : (activeRating === null && lhsPost.rating === r
                                                ? (r === 's' ? 'text-green-500 hover:bg-gray-800 border border-transparent' : (r === 'q' ? 'text-amber-500 hover:bg-gray-800 border border-transparent' : 'text-red-500 hover:bg-gray-800 border border-transparent'))
                                                : 'text-white hover:bg-gray-800 border border-transparent')">
                                    <span x-text="r"></span>
                                </button>
                            </template>
                        </div>
                        <template x-if="hasRatingConflict">
                            <span class="text-[10px] font-bold text-red-400 uppercase tracking-wide" title="Conflict Detected">⚠️ Rating Mismatch</span>
                        </template>
                    </div>

                    <div class="relative flex-1 min-w-[280px] max-w-xs"
                        x-data="tagAutocomplete()"
                        @add-tag="addCustomTag()"
                        @click.outside="isOpen = false">
                        
                        <div class="flex items-center gap-1.5 w-full">
                            <input type="text" 
                                x-model="tagInput" 
                                @input="onInput"
                                @keydown.enter.prevent="selectCurrentOrAdd()"
                                @keydown.arrow-down.prevent="navigate(1)"
                                @keydown.arrow-up.prevent="navigate(-1)"
                                @keydown.escape.prevent="isOpen = false"
                                placeholder="Add tag..."
                                class="flex-1 text-xs bg-gray-950 border border-gray-800 rounded px-2 py-1 text-gray-200 focus:outline-none focus:border-blue-500 min-w-0">
                            
                            <button type="button" 
                                    @click="commitTag()"
                                    class="text-xs px-2.5 py-1 bg-blue-600 hover:bg-blue-500 text-white rounded font-semibold transition shrink-0">
                                Add
                            </button>
                        </div>

                        <div x-show="isOpen && results.length > 0"
                            x-transition
                            class="absolute bottom-full mb-1 left-0 right-0 min-w-[340px] z-50 bg-gray-950 border border-gray-800 rounded shadow-2xl max-h-72 overflow-y-auto divide-y divide-gray-900"
                            style="display: none;">
                            
                            <template x-for="(item, index) in results" :key="item.aliasedFrom ? item.aliasedFrom + '->' + item.name : item.name">
                                <div @click="selectResult(item)"
                                    @mouseenter="selectedIndex = index"
                                    :class="{ 'bg-gray-800': selectedIndex === index }"
                                    class="flex items-center justify-between px-2.5 py-1.5 text-xs cursor-pointer hover:bg-gray-800 transition-colors gap-3">
                                    
                                    <div class="truncate flex items-center gap-1 min-w-0" 
                                        :title="item.aliasedFrom ? `${item.aliasedFrom} → ${item.name}` : item.name">
                                        
                                        <template x-if="item.aliasedFrom">
                                            <span class="flex items-center gap-1 truncate shrink-0 max-w-[45%]">
                                                <span :style="$store.tags.getTagStyle('INVALID')" 
                                                    class="truncate" 
                                                    x-text="item.aliasedFrom"></span>
                                                <span class="text-gray-500 select-none">→</span>
                                            </span>
                                        </template>
                                        
                                        <span :style="$store.tags.getTagStyle(item.category)" 
                                            class="truncate min-w-0" 
                                            x-text="item.name"></span>
                                    </div>

                                    <span class="text-gray-400 font-mono text-[11px] shrink-0 pl-1"
                                        :title="`${item.count.toLocaleString()} posts`">
                                        (<span x-text="formatCount(item.count)"></span>)
                                    </span>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </div>

            <!-- RHS: Single Active Comparison Post Card -->
            <div class="space-y-4">
                <template x-for="post in rhsPosts" :key="post.post_id">
                    <div class="bg-gray-950/80 border border-gray-800/80 rounded-lg p-3.5 text-xs space-y-3 shadow-sm">
                        
                        <!-- Post Header Line -->
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-2">
                                <template x-if="post.rating">
                                    <span class="px-1.5 py-0.5 rounded text-[11px] font-bold font-mono"
                                          :class="$store.tags.getRatingBadgeClass(post.rating)"
                                          x-text="$store.tags.getRatingLabel(post.rating)"></span>
                                </template>

                                <a :href="`https://e621.net/posts/${post.post_id}`" target="_blank"
                                   class="font-mono font-bold text-blue-400 hover:text-blue-300 hover:underline text-sm flex items-center space-x-1">
                                    <span x-text="`#${post.post_id}`"></span>
                                    <span class="text-gray-600 text-xs">&nearr;</span>
                                </a>

                                <template x-if="post.parent_id">
                                    <a :href="`https://e621.net/posts/${post.parent_id}`" target="_blank"
                                       class="font-mono text-[11px] text-gray-400 hover:text-blue-300 hover:underline">
                                        (Parent: #<span x-text="post.parent_id"></span>)
                                    </a>
                                </template>
                            </div>

                            <div class="flex items-center space-x-2">
                                <span class="font-mono text-[11px]"
                                    :class="image.isUniform(cluster.posts, post) ? 'text-gray-600' : 'text-gray-400'"
                                    x-text="image.formatSpecs(post)">
                                </span>

                                <template x-if="post.is_deleted">
                                    <span class="bg-red-950 text-red-400 border border-red-800/50 px-1.5 py-0.5 rounded text-[10px] font-bold">DELETED</span>
                                </template>
                                <template x-if="!post.is_deleted && post.is_flagged">
                                    <span class="bg-amber-950 text-amber-400 border border-amber-800/50 px-1.5 py-0.5 rounded text-[10px] font-bold">FLAGGED</span>
                                </template>
                            </div>
                        </div>

                        <!-- Post Pools List -->
                        <template x-if="post.pool_ids && post.pool_ids.length > 0">
                            <div class="flex flex-wrap items-center gap-1.5 pt-1">
                                <span class="text-gray-500 font-semibold text-[10px] uppercase tracking-wider">Pools:</span>
                                <template x-for="poolId in post.pool_ids" :key="poolId">
                                    <a :href="`https://e621.net/pools/${poolId}`" target="_blank"
                                       class="bg-gray-900 hover:bg-gray-800 text-blue-300 border border-gray-800 text-[10px] px-1.5 py-0.5 rounded font-mono transition">
                                        Pool #<span x-text="poolId"></span>
                                    </a>
                                </template>
                            </div>
                        </template>

                        <!-- RHS Tag Cloud -->
                        <div class="bg-gray-900/90 p-2.5 rounded-md border border-gray-800/80 space-y-1.5">
                            <div class="flex flex-wrap gap-x-1 gap-y-1">
                                <template x-for="tag in getSortedTags(post)" :key="tag.category + ':' + tag.name">
                                    <span class="font-mono text-[11px] leading-tight inline-flex items-center px-1 rounded border border-transparent select-none transition-all duration-150 ease-in-out"
                                        :class="tagpill.getTagClasses(tag, post, 'rhs', { hoveredImplicationData, isLhs: isTagOnLhs(tag.name) })"
                                        :style="tagpill.getTagStyle(tag, post, hoveredImplicationData)"
                                        :title="tagpill.getTagTitle(tag.name)"
                                        @click="if (!isTagOnLhs(tag.name)) addTagWithImplications(tag.name)"
                                        @mouseenter="hoveredImplicationData = getImplicationChain(post.post_id, tag.name, post)"
                                        @mouseleave="hoveredImplicationData = null">
                                        <span x-text="tag.name"></span>
                                        <span x-show="isImpliedTag(tag.name, post)" class="text-emerald-400 font-bold text-[9px] ml-0.5 select-none" title="Implied tag">i</span>
                                        <template x-if="!isTagOnLhs(tag.name)">
                                            <span class="ml-1 text-[9px] text-blue-400 font-bold">+</span>
                                        </template>
                                    </span>
                                </template>
                            </div>
                        </div>
                    </div>
                </template>
            </div>

        </div>
    </template>

</div>
