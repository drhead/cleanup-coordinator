<div :id="'cluster-' + cluster.clusterIndex" class="border rounded-lg transition shadow-md overflow-hidden" x-data="{ 
          activeView: 'none', 
          hoveredImplicationData: null, 
          hoveredMergedData: null,
          resMgr: resolutionManager(cluster),
          showPreviews: false,
          loadingPreviews: false,
          getOrderedPreviewPosts() {
              if (!this.cluster || !Array.isArray(this.cluster.posts)) return [];
              const posts = [...this.cluster.posts];
              if (this.activeView === 'reconcile' && this.resMgr?.activeReconciliation) {
                  const recon = this.resMgr.activeReconciliation;
                  const lhsId = recon.selectedSuperiorId || recon.lhsPostId;
                  const rhsIds = new Set(recon.rhsPostIds || []);
                  return posts.sort((a, b) => {
                      const getRank = (p) => {
                          if (p.postId === lhsId) return 0;
                          if (rhsIds.has(p.postId)) return 1;
                          return 2;
                      };
                      return getRank(a) - getRank(b);
                  });
              }
              return posts;
          },
          getPreviewBorderClass(post) {
              if (!post) return 'border-gray-800';
              if (this.activeView === 'compare' && this.resMgr?.activeComparison) {
                  const pair = this.resMgr.activeComparison.currentPair;
                  if (pair && (pair.a?.postId === post.postId || pair.b?.postId === post.postId)) {
                      return 'border-gray-800 ring-2 ring-offset-2 ring-offset-gray-900 ring-blue-500';
                  }
              } else if (this.activeView === 'reconcile' && this.resMgr?.activeReconciliation) {
                  const recon = this.resMgr.activeReconciliation;
                  const lhsId = recon.selectedSuperiorId || recon.lhsPostId;
                  const rhsIds = new Set(recon.rhsPostIds || []);
                  if (post.postId === lhsId) {
                      return 'border-gray-800 ring-2 ring-offset-2 ring-offset-gray-900 ring-blue-500';
                  }
                  if (rhsIds.has(post.postId)) {
                      return 'border-gray-800 ring-2 ring-offset-2 ring-offset-gray-900 ring-purple-500';
                  }
              }
              return 'border-gray-800';
          },
          async togglePreviews() {
              if (this.showPreviews) {
                  this.showPreviews = false;
                  return;
              }
              this.loadingPreviews = true;
              try {
                  if (typeof window.ensureClusterPostsInfo === 'function') {
                      await window.ensureClusterPostsInfo(this.cluster.posts);
                  }
                  this.showPreviews = true;
              } catch (err) {
                  console.warn('[ClusterCard] Failed to load previews:', err);
              } finally {
                  this.loadingPreviews = false;
              }
          },
          discardAndExit() {
              this.resMgr.resetClusterWork();
              this.activeView = 'none';
          }
      }" :class="cluster.isResolved ? 'bg-gray-900/60 border-gray-800/80 opacity-80' : 'bg-gray-900 border-gray-800'">

    <!-- Cluster Header Line (Collapsible Trigger) -->
    <div class="px-4 py-2.5 flex flex-wrap items-center justify-between gap-2 cursor-pointer select-none hover:bg-gray-800/30 transition min-h-12.5"
        @click="cluster.collapsed = !cluster.collapsed"
        :class="cluster.collapsed ? 'border-b border-transparent' : 'border-b border-gray-800/60'">

        <!-- Left Indicators -->
        <div class="flex flex-wrap items-center gap-2 h-7">
            <svg class="w-4 h-4 text-gray-400 hover:text-white transition-transform duration-150 shrink-0"
                :class="cluster.collapsed ? '' : 'rotate-90'" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd"
                    d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z"
                    clip-rule="evenodd" />
            </svg>

            <span class="font-mono text-xs text-gray-400 font-bold leading-none"
                x-text="`Cluster #${cluster.clusterIndex}`"></span>

            <!-- Resolution Status Badge -->
            <span
                class="text-[10px] px-2 h-5 rounded font-bold uppercase tracking-wider inline-flex items-center leading-none"
                :class="cluster.isResolved ? 'bg-green-950 text-green-400 border border-green-800/50' : 'bg-gray-800 text-gray-400'"
                x-text="cluster.isResolved ? 'RESOLVED' : 'UNRESOLVED'"></span>

            <!-- BLACKLISTED Label Indicator -->
            <template x-if="cluster.isBlacklisted">
                <span
                    class="bg-black text-white border border-gray-700 text-[10px] px-2 h-5 rounded font-bold uppercase tracking-wider shadow-sm inline-flex items-center leading-none"
                    :title="`Matched Rule: ${cluster.matchedRule}`">
                    BLACKLISTED
                </span>
            </template>

            <!-- Search on e621 Link (Visible only when opened) -->
            <template x-if="!cluster.collapsed && cluster.posts && cluster.posts.length > 0">
                <a :href="`https://e621.net/posts?tags=id:${cluster.posts.map(p => p.postId).join(',')}`"
                    target="_blank" rel="noopener noreferrer" @click.stop
                    class="bg-gray-800/80 hover:bg-gray-700/80 text-blue-400 hover:text-blue-300 border border-gray-700/60 text-[10px] px-2 h-5 rounded font-semibold inline-flex items-center gap-1 leading-none shadow-sm transition"
                    title="Search all posts in this cluster on e621">
                    <svg class="w-3 h-3 shrink-0" fill="none" stroke="currentColor" stroke-width="2"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
                    </svg>
                    <span>Search on e621</span>
                    <span class="text-gray-500 text-[10px]">&nearr;</span>
                </a>
            </template>
        </div>

        <!-- Right Side: Cluster Note & Action Controls -->
        <div class="flex items-center gap-3 h-7">
            <!-- Cluster Warning Note (if present) -->
            <template x-if="cluster.note">
                <div
                    class="h-7 flex items-center space-x-1.5 text-xs font-medium text-amber-300 bg-amber-950/60 border border-amber-800/80 px-3 rounded-md shadow-sm">
                    <span class="text-amber-400 font-bold leading-none">⚠️</span>
                    <span class="leading-none" x-text="cluster.note"></span>
                </div>
            </template>

            <!-- Show Previews Button: Visible when cluster is expanded -->
            <template x-if="!cluster.collapsed && cluster.posts && cluster.posts.length > 0">
                <div class="flex items-center h-7" @click.stop>
                    <button @click.stop="togglePreviews()" :disabled="loadingPreviews"
                        class="h-7 bg-gray-800 hover:bg-gray-700 text-gray-300 hover:text-white border border-gray-700 text-xs px-3 rounded-md font-semibold transition flex items-center gap-1.5 shadow-sm cursor-pointer leading-none">
                        <template x-if="loadingPreviews">
                            <svg class="animate-spin w-3.5 h-3.5 text-gray-400" xmlns="http://www.w3.org/2000/svg"
                                fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor"
                                    stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor"
                                    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                                </path>
                            </svg>
                        </template>
                        <template x-if="!loadingPreviews">
                            <svg class="w-3.5 h-3.5 shrink-0 text-gray-400" fill="none" stroke="currentColor"
                                stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
                            </svg>
                        </template>
                        <span x-text="showPreviews ? 'Hide Previews' : 'Show Previews'"></span>
                    </button>
                </div>
            </template>

            <!-- Action Button: Only visible on header when expanded & activeView === 'none' -->
            <template x-if="!cluster.collapsed && activeView === 'none'">
                <div class="flex items-center h-7" @click.stop>
                    <div>
                        <!-- Disabled State: <=1 total post or 0 active posts -->
                        <template
                            x-if="!cluster.posts || cluster.posts.length <= 1 || cluster.posts.filter(p => !p.isDeleted && !p.isFlagged).length === 0">
                            <button disabled :title="!cluster.posts || cluster.posts.length <= 1 
                                        ? 'Cluster contains only 1 post' 
                                        : 'No active (non-deleted, non-flagged) posts remaining in cluster'"
                                class="h-7 bg-gray-800 text-gray-500 border border-gray-700 text-xs px-3 rounded-md font-semibold flex items-center gap-1.5 cursor-not-allowed leading-none">
                                <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" stroke-width="2"
                                    viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
                                </svg>
                                <span>Start Comparison</span>
                            </button>
                        </template>

                        <!-- Enabled State -->
                        <template
                            x-if="cluster.posts && cluster.posts.length > 1 && cluster.posts.filter(p => !p.isDeleted && !p.isFlagged).length > 0">
                            <div>
                                <!-- Single Active Image Remaining: Re-tag Mode (Purple theme, Tag SVG) -->
                                <template x-if="cluster.posts.filter(p => !p.isDeleted && !p.isFlagged).length === 1">
                                    <button @click.stop="activeView = 'reconcile'"
                                        class="h-7 bg-purple-950/80 hover:bg-purple-900/90 text-purple-300 border border-purple-800/80 text-xs px-3 rounded-md font-semibold transition flex items-center gap-1.5 shadow-md cursor-pointer leading-none">
                                        <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor"
                                            stroke-width="2" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round"
                                                d="M9.568 3H5.25A2.25 2.25 0 003 5.25v4.318c0 .597.237 1.17.659 1.591l9.581 9.581c.699.699 1.78.872 2.607.33a18.095 18.095 0 005.223-5.223c.542-.827.369-1.908-.33-2.607L11.16 3.66A2.25 2.25 0 009.568 3z" />
                                            <path stroke-linecap="round" stroke-linejoin="round"
                                                d="M6 6h.008v.008H6V6z" />
                                        </svg>
                                        <span>Re-tag Cluster</span>
                                    </button>
                                </template>

                                <!-- Multiple Active Images Remaining: Standard Comparison Mode (Blue theme, Magnifier SVG) -->
                                <template x-if="cluster.posts.filter(p => !p.isDeleted && !p.isFlagged).length > 1">
                                    <button @click.stop="activeView = 'compare'"
                                        class="h-7 bg-blue-600 hover:bg-blue-500 text-white text-xs px-3 rounded-md font-semibold transition flex items-center gap-1.5 shadow-md cursor-pointer leading-none">
                                        <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor"
                                            stroke-width="2" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round"
                                                d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
                                        </svg>
                                        <span>Start Comparison</span>
                                    </button>
                                </template>
                            </div>
                        </template>
                    </div>
                </div>
            </template>

            <!-- Discard & Exit Button: Only visible on header when expanded & activeView !== 'none' -->
            <template x-if="!cluster.collapsed && activeView !== 'none'">
                <div class="flex items-center h-7" @click.stop>
                    <button @click.stop="discardAndExit()"
                        class="h-7 bg-red-950/60 hover:bg-red-900/80 text-red-300 hover:text-red-200 border border-red-800/60 text-xs px-3 rounded-md font-semibold transition flex items-center gap-1.5 cursor-pointer leading-none shadow-sm"
                        title="Exit workflow and discard all uncommitted changes for this cluster">
                        <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" stroke-width="2"
                            viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                        <span>Discard & Exit</span>
                    </button>
                </div>
            </template>
        </div>
    </div>

    <!-- Expanded Body Content -->
    <template x-if="!cluster.collapsed">
        <div class="p-4 pt-3">
            <!-- Thumbnail Previews Row -->
            <template x-if="showPreviews">
                <div class="my-3 pb-4 mb-4 border-b border-gray-800/80">
                    <div class="flex flex-nowrap gap-3 items-start overflow-x-auto pb-2 pt-1 px-1">
                        <template x-for="post in getOrderedPreviewPosts()" :key="post.postId">
                            <!-- Single Unified Thumbnail Block with Drop Shadow and Dynamic Active Highlight -->
                            <div class="w-36 shrink-0 border rounded-lg overflow-hidden bg-gray-950 flex flex-col shadow-md/50 transition-all duration-150"
                                :class="getPreviewBorderClass(post)">

                                <!-- 1. Header Bar (ID & Rating) -->
                                <div
                                    class="bg-gray-900 px-2 py-1 flex items-center justify-between text-xs border-b border-gray-800">
                                    <a :href="`https://e621.net/posts/${post.postId}`" target="_blank"
                                        class="font-mono font-bold text-blue-400 hover:underline"
                                        x-text="`#${post.postId}`"></a>

                                    <!-- Rating -->
                                    <div class="flex items-center gap-1 font-mono text-[10px]">
                                        <template x-if="post.rating">
                                            <span class="px-1.5 py-0.5 rounded font-bold uppercase"
                                                :class="$store.tags?.getRatingBadgeClass(post.rating)"
                                                x-text="`${$store.tags?.getRatingLabel(post.rating)}`">
                                            </span>
                                        </template>
                                    </div>
                                </div>

                                <!-- 2. Image Viewport (Clickable for Image Modal) -->
                                <div class="w-full min-h-20 bg-gray-950 flex items-center justify-center overflow-hidden cursor-pointer group"
                                    @click="image.openModal(post)"
                                    :title="post.isDeleted ? 'Deleted post' : 'Click to view full image in modal'">
                                    <!-- DELETED Post Placeholder -->
                                    <template x-if="post.isDeleted">
                                        <span
                                            class="bg-red-950 text-red-400 border border-red-800/60 px-2.5 py-1 rounded text-xs font-mono font-bold uppercase tracking-wider shadow">DELETED</span>
                                    </template>

                                    <!-- Valid Image -->
                                    <template x-if="!post.isDeleted && (post.previewUrl || post.fileUrl)">
                                        <img :src="post.previewUrl || post.fileUrl" :alt="`Post #${post.postId}`"
                                            class="max-h-40 max-w-full object-contain group-hover:brightness-125 transition-[filter] duration-150" />
                                    </template>

                                    <!-- Missing Image -->
                                    <template x-if="!post.isDeleted && !post.previewUrl && !post.fileUrl">
                                        <span class="text-gray-600 text-xs font-mono text-center">No Image</span>
                                    </template>
                                </div>

                                <!-- 3. Image Info Bar -->
                                <div
                                    class="bg-gray-900 border-t border-gray-800 px-2 py-1 text-[10px] text-gray-500 text-center font-mono">
                                    <span class="font-mono text-[10px]" x-html="image.formatSpecs(post, cluster.posts)">
                                    </span>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </template>

            <!-- Cluster Workflow Container -->
            <div>

                <!-- Screen 1: Comparison View Scope -->
                <template x-if="activeView === 'compare'">
                    <div x-data="ComparisonManager(resMgr)" x-init="startComparison($data, $el)">
                        <template x-if="isActive">
                            <div class="space-y-3">
                                <load src="/templates/components/cluster-comparison.html" />
                            </div>
                        </template>
                    </div>
                </template>

                <!-- Screen 2: Association / Structuring View Scope -->
                <template x-if="activeView === 'associate'">
                    <div x-data="AssociationManager(resMgr)" x-init="init()">
                        <div class="space-y-3">
                            <load src="/templates/components/cluster-association.html" />
                        </div>
                    </div>
                </template>

                <!-- Screen 3: Tag Reconciliation View Scope -->
                <template x-if="activeView === 'reconcile'">
                    <div x-data="ReconciliationManager(resMgr)" x-init="startReconciliation()">
                        <!-- Loading Spinner while ReconciliationManager initializes -->
                        <template x-if="isLoading || !isActive">
                            <div
                                class="flex flex-col items-center justify-center min-h-90 p-8 space-y-3 bg-gray-950/60 border border-gray-800/80 rounded-lg shadow-inner">
                                <div
                                    class="w-8 h-8 border-3 border-emerald-500/20 border-t-emerald-500 rounded-full animate-spin">
                                </div>
                                <p class="text-xs text-gray-400 font-medium animate-pulse">Loading tag reconciliation...
                                </p>
                            </div>
                        </template>

                        <template x-if="!isLoading && isActive">
                            <div class="space-y-3">
                                <load src="/templates/components/cluster-reconciliation.html" />
                            </div>
                        </template>
                    </div>
                </template>

                <!-- Screen 3: Summary View Scope -->
                <template x-if="activeView === 'summary'">
                    <div x-data="summaryManager(resMgr)" class="space-y-3">
                        <load src="/templates/components/cluster-summary.html" />
                    </div>
                </template>

            </div>

            <!-- Posts Grid inside Cluster -->
            <template x-if="activeView === 'none'">
                <div
                    class="bg-gray-950 border border-gray-800/80 rounded-lg p-4 space-y-4 grid grid-cols-1 md:grid-cols-2 gap-4">
                    <template x-for="post in cluster.posts" :key="post.postId">
                        <load src="/templates/components/post-card.html" />
                    </template>
                </div>
            </template>
        </div>
    </template>
</div>
