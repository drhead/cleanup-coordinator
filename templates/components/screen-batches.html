<div x-show="currentScreen === 'batches'" class="space-y-4">
    
    <!-- Explorer Header -->
    <div class="flex items-center justify-between">
        <div>
            <h2 class="text-xl font-bold text-gray-200" x-text="activeProject?.title"></h2>
            <p class="text-xs text-gray-400">Click any batch row to inspect or work on it.</p>
        </div>
        <div class="text-xs text-gray-400 font-mono" x-text="`Total Batches: ${batches.length}`"></div>
    </div>

    <!-- Batches Table View -->
    <div class="bg-gray-900 border border-gray-800 rounded-lg overflow-hidden">
        <table class="w-full text-left text-xs font-mono">
            <thead class="bg-gray-950 text-gray-400 border-b border-gray-800 uppercase tracking-wider">
                <tr>
                    <th class="py-2 px-3 w-12 text-center">#</th>
                    <th class="py-2 px-3 whitespace-nowrap">Status</th>
                    <th class="py-2 px-3">Progress</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-800/60">
                <template x-for="batch in batches" :key="batch.batch_id">
                    <!-- Batch Table Row -->
                    <tr class="hover:bg-gray-900 cursor-pointer transition"
                        @click="viewBatchDetail(batch)">
                        
                        <!-- Batch Number Column -->
                        <td class="py-2 px-3 font-bold text-gray-300 text-center" x-text="batch.batch_number"></td>
                        
                        <!-- Batch Status & Expiry Column -->
                        <td class="py-2 px-3 whitespace-nowrap">
                            <div class="flex items-center space-x-2">
                                <span class="px-2 py-0.5 rounded text-[10px] font-bold"
                                      :class="getBatchStatusClass(batch)"
                                      x-text="getBatchStatusLabel(batch)"></span>
                                
                                <!-- Countdown Timer on Claimed Batches -->
                                <template x-if="batch.status === 'CLAIMED' && batch.leased_until">
                                    <span class="text-[11px] text-amber-400 font-semibold"
                                          x-text="getRemainingTimeString(batch.leased_until)"></span>
                                </template>
                            </div>
                        </td>

                        <!-- Batch Progress Column -->
                        <td class="py-2.5 px-4">
                            <div class="flex items-center space-x-1.5 flex-wrap gap-y-1">
                                <template x-for="cluster in batch.clusters" :key="cluster.cluster_id">
                                    <div class="w-2.5 h-2.5 rounded-sm transition-all"
                                        :class="{
                                            'bg-green-500': cluster.is_resolved,
                                            'bg-zinc-900 border border-gray-800': !cluster.is_resolved && cluster.is_blacklisted,
                                            'bg-gray-800 border border-gray-700': !cluster.is_resolved && !cluster.is_blacklisted
                                        }"
                                        :title="`Cluster #${cluster.cluster_index}: ${cluster.is_resolved ? 'Resolved' : cluster.is_blacklisted ? 'Blacklisted' : 'Pending'}`">
                                    </div>
                                </template>
                            </div>
                        </td>
                    </tr>
                </template>
            </tbody>
        </table>
    </div>
</div>
